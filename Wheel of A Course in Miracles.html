"Chapter 9, section I, paragraph 13, sentence 3"],["If you would know your prayers are answered, never doubt a Son of God.","Chapter 9, section II, paragraph 4, sentence 1"],["The message your brother gives you is up to you.","Chapter 9, section II, paragraph 5, sentence 1"],["You can no more pray for yourself alone than you can find joy for yourself alone.","Chapter 9, section II, paragraph 6, sentence 1"],["Prayer is the restatement of inclusion, directed by the Holy Spirit under the laws of God.","Chapter 9, section II, paragraph 6, sentence 2"],["Prayer is the restatement of inclusion, directed by the Holy Spirit under the laws of God. Salvation is of your brother.","Chapter 9, section II, paragraph 6, sentences 2-3"],["Salvation is of your brother. The Holy Spirit extends from your mind to his, and answers you .","Chapter 9, section II, paragraph 6, sentences 3-4"],["The Holy Spirit extends from your mind to his, and answers you .","Chapter 9, section II, paragraph 6, sentence 4"],["You cannot hear the Voice for God in yourself alone, because you are not alone.","Chapter 9, section II, paragraph 6, sentence 5"],["He will deny you nothing because you have denied Him nothing, and so you can share everything.","Chapter 9, section II, paragraph 11, sentence 3"],["Errors are of the ego, and correction of errors lies in the relinquishment of the ego.","Chapter 9, section III, paragraph 2, sentence 3"],["If you point out the errors of your brother’s ego you must be seeing through yours, because the Holy Spirit does not perceive his errors.","Chapter 9, section III, paragraph 3, sentence 1"],["When you react at all to errors, you are not listening to the Holy Spirit.","Chapter 9, section III, paragraph 4, sentence 1"],["If you would find your way and keep it, see only truth beside you for you walk together.","Chapter 9, section III, paragraph 7, sentence 3"],["The Holy Spirit in you forgives all things in you and in your brother.","Chapter 9, section III, paragraph 7, sentence 4"],["Correction is of God, Who does not know of arrogance.","Chapter 9, section III, paragraph 7, sentence 9"],["The Holy Spirit forgives everything because God created everything.","Chapter 9, section III, paragraph 8, sentence 1"],["God gave you the function to create in eternity.","Chapter 9, section III, paragraph 8, sentence 4"],["You have a part to play in the Atonement, but the plan of the Atonement is beyond you.","Chapter 9, section IV, paragraph 2, sentence 1"],["You do not understand how to overlook errors, or you would not make them.","Chapter 9, section IV, paragraph 2, sentence 2"],["The Holy Spirit merely reminds you of the natural use of your abilities.","Chapter 9, section IV, paragraph 3, sentence 2"],["The ego’s plan, of course, makes no sense and will not work.","Chapter 9, section IV, paragraph 4, sentence 2"],["By seeing it clearly, you have made it real and cannot overlook it.","Chapter 9, section IV, paragraph 4, sentence 6"],["Only if the decision that reality is fearful is wrong can God be right.","Chapter 9, section IV, paragraph 10, sentence 3"],["Had you known, you could no more have been wrong than God can.","Chapter 9, section IV, paragraph 10, sentence 6"],["The symbols of fantasy are of the ego, and of these you will find many.","Chapter 9, section IV, paragraph 11, sentence 3"],["The ego’s plan for forgiveness is far more widely used than God’s.","Chapter 9, section V, paragraph 1, sentence 1"],["All unhealed healers follow the ego’s plan for forgiveness in one form or another.","Chapter 9, section V, paragraph 3, sentence 3"],["Healing is not mysterious. Nothing will change unless it is understood, since light is understanding.","Chapter 9, section V, paragraph 6, sentences 4-5"],["Nothing will change unless it is understood, since light is understanding.","Chapter 9, section V, paragraph 6, sentence 5"],["God has but one Son, knowing them all as one.","Chapter 9, section VI, paragraph 3, sentence 5"],["Everyone God created is part of you and shares His glory with you.","Chapter 9, section VI, paragraph 3, sentence 9"],["Very simply the Holy Spirit teaches you to awaken others.","Chapter 9, section VI, paragraph 5, sentence 2"],["In your open mind are your creations, in perfect communication born of perfect understanding.","Chapter 9, section VI, paragraph 7, sentence 4"],["God’s meaning is incomplete without you, and you are incomplete without your creations.","Chapter 9, section VI, paragraph 7, sentence 7"],["God’s Will is your salvation.","Chapter 9, section VII, paragraph 1, sentence 1"],["You do not have to seek far for salvation.","Chapter 9, section VII, paragraph 1, sentence 5"],["God wills you perfect happiness now.","Chapter 9, section VII, paragraph 1, sentence 8"],["The ego is deceived by everything you do, especially when you respond to the Holy Spirit, because at such times its confusion increases.","Chapter 9, section VII, paragraph 4, sentence 4"],["You can only go beyond it, look back from a point where sanity exists and see the contrast .","Chapter 9, section VII, paragraph 6, sentence 3"],["With the grandeur of God in you, you have chosen to be little and to lament your littleness.","Chapter 9, section VII, paragraph 6, sentence 5"],["The grandiosity of the ego is its alternative to the grandeur of God.","Chapter 9, section VIII, paragraph 1, sentence 6"],["If you are willing to look upon your grandeur you cannot despair, and therefore you cannot want the ego.","Chapter 9, section VIII, paragraph 6, sentence 2"],["Your grandeur will never deceive you, but your illusions always will.","Chapter 9, section VIII, paragraph 7, sentence 6"],["Your grandeur will never deceive you, but your illusions always will. Illusions are deceptions.","Chapter 9, section VIII, paragraph 7, sentences 6-7"],["God is incomplete without you because His grandeur is total, and you cannot be missing from it.","Chapter 9, section VIII, paragraph 9, sentence 8"],["You are altogether irreplaceable in the Mind of God.","Chapter 9, section VIII, paragraph 10, sentence 1"],["In an evil dream that but seemed real while you were dreaming it.","Clarification of Terms, section 2, paragraph 6, sentence 13"],["The unified spirit is God’s one Son, or Christ.","Clarification of Terms, section 1, paragraph 1, sentence 4"],["In this world, because the mind is split, the Sons of God appear to be separate.","Clarification of Terms, section 1, paragraph 2, sentence 1"],["Creation continues unabated because that is the Will of God.","Clarification of Terms, section 1, paragraph 4, sentence 3"],["Right-mindedness listens to the Holy Spirit, forgives the world, and through Christ’s vision sees the real world in its place.","Clarification of Terms, section 1, paragraph 5, sentence 2"],["In this world the only remaining freedom is the freedom of choice; always between two choices or two voices.","Clarification of Terms, section 1, paragraph 7, sentence 1"],["Will is not involved in perception at any level, and has nothing to do with choice.","Clarification of Terms, section 1, paragraph 7, sentence 2"],["Consciousness is the receptive mechanism, receiving messages from above or below; from the Holy Spirit or the ego Consciousness has levels and awareness can shift quite dramatically, but it cannot transcend the perceptual realm.","Clarification of Terms, section 1, paragraph 7, sentence 3"],["God’s peace can never come where anger is, for anger must deny that peace exists.","Manual for Teachers, question 20, introduction, paragraph 3, sentence 3"],["A tranquil mind is not a little gift.","Manual for Teachers, question 20, introduction, paragraph 4, sentence 8"],["You see in death escape from what you made.","Manual for Teachers, question 20, introduction, paragraph 5, sentence 2"],["Life and death seem to be opposites because you have decided death ends life.","Manual for Teachers, question 20, introduction, paragraph 5, sentence 6"],["The Will of God is one and all there is.","Manual for Teachers, question 20, introduction, paragraph 6, sentence 9"],["God’s peace is the condition for His Will.","Manual for Teachers, question 20, introduction, paragraph 6, sentence 12"],["The Holy Spirit mediates between illusions and the truth.","Workbook Part II, section 7, paragraph 1, sentence 1"],["The Holy Spirit understands the means you made, by which you would attain what is forever unattainable.","Workbook Part II, section 7, paragraph 3, sentence 2"],["Without forgiveness will your dreams remain to terrify you.","Workbook Part II, section 7, paragraph 4, sentence 2"],["The Holy Spirit is His gift, by which the quietness of Heaven is restored to God’s beloved Son.","Workbook Part II, section 7, paragraph 5, sentence 3"],["I can be hurt by nothing but my thoughts.","Lesson 281, idea of the day"],["Your Thoughts can only bring me happiness.","Lesson 281, paragraph 1, sentence 3"],["I can be hurt by nothing but my thoughts. The Thoughts I think with You can only bless.","Lesson 281, paragraph 1, sentences 5-6"],["The Thoughts I think with You can only bless.","Lesson 281, paragraph 1, sentence 6"],["The Thoughts I think with You can only bless. The Thoughts I think with You alone are true.","Lesson 281, paragraph 1, sentences 6-7"],["The Thoughts I think with You alone are true.","Lesson 281, paragraph 1, sentence 7"],["I will not be afraid of love today.","Lesson 282, idea of the day"],["Father, Your Name is Love and so is mine.","Lesson 282, paragraph 2, sentence 1"],["The name of fear is simply a mistake.","Lesson 282, paragraph 2, sentence 4"],["The name of fear is simply a mistake. Let me not be afraid of truth today.","Lesson 282, paragraph 2, sentences 4-5"],["Let me not be afraid of truth today.","Lesson 282, paragraph 2, sentence 5"],["I am he my Father loves.","Lesson 283, paragraph 1, sentence 4"],["I am he my Father loves. My holiness remains the light of Heaven and the Love of God.","Lesson 283, paragraph 1, sentences 4-5"],["My holiness remains the light of Heaven and the Love of God.","Lesson 283, paragraph 1, sentence 5"],["I can elect to change all thoughts that hurt.","Lesson 284, idea of the day"],["Father, what You have given cannot hurt, so grief and pain must be impossible.","Lesson 284, paragraph 2, sentence 1"],["My holiness shines bright and clear today.","Lesson 285, idea of the day"],["And I will ask for only joyous things the instant I accept my holiness.","Lesson 285, paragraph 1, sentence 3"],["My holiness is part of me, and also part of You.","Lesson 285, paragraph 2, sentence 3"],["My holiness is part of me, and also part of You. And what can alter Holiness Itself?","Lesson 285, paragraph 2, sentences 3-4"],["And what can alter Holiness Itself?","Lesson 285, paragraph 2, sentence 4"],["The hush of Heaven holds my heart today.","Lesson 286, idea of the day"],["In You is everything I hope to find already given me.","Lesson 286, paragraph 1, sentence 6"],["In You is everything I hope to find already given me. Your peace is mine.","Lesson 286, paragraph 1, sentences 6-7"],["Your peace is mine. My heart is quiet, and my mind at rest.","Lesson 286, paragraph 1, sentences 7-8"],["My heart is quiet, and my mind at rest.","Lesson 286, paragraph 1, sentence 8"],["My heart is quiet, and my mind at rest. Your Love is Heaven, and Your Love is mine.","Lesson 286, paragraph 1, sentences 8-9"],["Your Love is Heaven, and Your Love is mine.","Lesson 286, paragraph 1, sentence 9"],["You are my goal, my Father.","Lesson 287, idea of the day"],["Your Son would be as You created him.","Lesson 287, paragraph 2, sentence 6"],["I cannot come to You without my brother.","Lesson 288, paragraph 1, sentence 2"],["And you will know you have forgiven me if you behold your brother in the light of holiness.","Lesson 288, paragraph 2, sentence 2"],["Unless the past is over in my mind, the real world must escape my sight.","Lesson 289, paragraph 1, sentence 1"],["This the past was made to hide, for this the world that can be looked on only now.","Lesson 289, paragraph 1, sentence 4"],["Father, let me not look upon a past that is not there.","Lesson 289, paragraph 2, sentence 1"],["You cannot fail to hear me, Father.","Lesson 290, paragraph 2, sentence 2"],["Take pity on yourself, so long enslaved.","Chapter 22, introduction, paragraph 3, sentence 1"],["For an unholy relationship is based on differences, where each one thinks the other has what he has not.","Chapter 22, introduction, paragraph 4, sentence 5"],["The brain cannot interpret what your vision sees.","Chapter 22, section I, paragraph 2, sentence 7"],["Only your vision can convey to you what you can see.","Chapter 22, section I, paragraph 5, sentence 4"],["You make it through awareness older than perception, and yet reborn in just an instant.","Chapter 22, section I, paragraph 10, sentence 2"],["You can be sure indeed that any seeming happiness that does not last is really fear.","Chapter 22, section II, paragraph 3, sentence 5"],["Joy does not turn to sorrow, for the eternal cannot change.","Chapter 22, section II, paragraph 3, sentence 6"],["Only the timeless must remain unchanged, but everything in time can change with time.","Chapter 22, section II, paragraph 3, sentence 8"],["You are no more a slave to time than to the world you made.","Chapter 22, section II, paragraph 8, sentence 8"],["Only your thoughts have been impossible. Salvation cannot be.","Chapter 22, section II, paragraph 11, sentences 1-2"],["Heaven is the home of perfect purity, and God created it for you.","Chapter 22, section II, paragraph 13, sentence 6"],["Sin is a block, set like a heavy gate, locked and without a key, across the road to peace.","Chapter 22, section III, paragraph 3, sentence 2"],["Only the form of error attracts the ego.","Chapter 22, section III, paragraph 4, sentence 1"],["Sin is but error in a special form the ego venerates.","Chapter 22, section III, paragraph 4, sentence 5"],["Reason will tell you that the form of error is not what makes it a mistake.","Chapter 22, section III, paragraph 5, sentence 1"],["If what the form conceals is a mistake, the form cannot prevent correction.","Chapter 22, section III, paragraph 5, sentence 2"],["If what the form conceals is a mistake, the form cannot prevent correction. The body’s eyes see only form.","Chapter 22, section III, paragraph 5, sentences 2-3"],["The body’s eyes see only form.","Chapter 22, section III, paragraph 5, sentence 3"],["Nothing so blinding as perception of form.","Chapter 22, section III, paragraph 6, sentence 7"],["Unholy values will produce confusion, and in awareness.","Chapter 22, section III, paragraph 9, sentence 2"],["You must go either one way or the other.","Chapter 22, section IV, paragraph 1, sentence 2"],["A choice made with the power of Heaven to uphold it cannot be undone.","Chapter 22, section IV, paragraph 2, sentence 3"],["The gates of Heaven, open now for you, will you now open to the sorrowful.","Chapter 22, section IV, paragraph 4, sentence 4"],["Every mistake you make, your brother will gently have corrected for you.","Chapter 22, section IV, paragraph 5, sentence 1"],["And only an illusion stands between you and your brother, and the holy Self you share together.","Chapter 22, section IV, paragraph 7, sentence 8"],["Everything that needs defence you do not want, for anything that needs defence will weaken you.","Chapter 22, section V, paragraph 1, sentence 12"],["Belief in sin needs great defence, and at enormous cost.","Chapter 22, section V, paragraph 2, sentence 6"],["In truth you and your brother stand together, with nothing in between.","Chapter 22, section V, paragraph 3, sentence 4"],["You will be sanctified by your brother, using your body only to serve the sinless.","Chapter 22, section VI, paragraph 3, sentence 6"],["Only in your joint will does healing lie.","Chapter 22, section VI, paragraph 4, sentence 6"],["Before a holy relationship there is no sin.","Chapter 22, section VI, paragraph 5, sentence 1"],["Each part of Heaven that you bring is given you.","Chapter 22, section VI, paragraph 5, sentence 5"],["The light you bring you do not recognise, and yet you will remember.","Chapter 22, section VI, paragraph 6, sentence 2"],["Each little gift you offer to your brother lights up the world.","Chapter 22, section VI, paragraph 9, sentence 9"],["You do not see that every sin and every condemnation that you perceive and justify is an attack upon your Father.","Chapter 22, section VI, paragraph 11, sentence 3"],["Only the different can attack.","Chapter 22, section VI, paragraph 13, sentence 1"],["The world you see is an illusion of a world.","Clarification of Terms, section 4, paragraph 1, sentence 1"],["The one correction possible for false perception must be true perception.","Clarification of Terms, section 4, paragraph 3, sentence 2"],["True perception is the means by which the world is saved from sin, for sin does not exist.","Clarification of Terms, section 4, paragraph 3, sentence 8"],["The world stands like a block before Christ’s face.","Clarification of Terms, section 4, paragraph 4, sentence 1"],["The world of bodies is the world of sin, for only if there were a body is sin possible.","Clarification of Terms, section 4, paragraph 5, sentence 5"],["From sin comes guilt as surely as forgiveness takes all guilt away.","Clarification of Terms, section 4, paragraph 5, sentence 6"],["Gone is perception, false and true alike.","Clarification of Terms, section 4, paragraph 7, sentence 2"],["There are some general rules which do apply, although each one must use them as best he can in his own way.","Manual for Teachers, question 16, introduction, paragraph 3, sentence 4"],["The little that the body fences off becomes the self, preserved through sacrifice of all the rest.","Chapter 26, section I, paragraph 3, sentence 1"],["The body is a loss, and can be made to sacrifice.","Chapter 26, section I, paragraph 4, sentence 1"],["Without your special function has this world no meaning for you.","Chapter 26, section I, paragraph 5, sentence 2"],["In Heaven, God’s Son is not imprisoned in a body, nor is sacrificed in solitude to sin.","Chapter 26, section I, paragraph 7, sentence 4"],["The miracle of justice can correct all errors.","Chapter 26, section II, paragraph 4, sentence 1"],["The Holy Spirit does not evaluate injustices as great or small, or more or less.","Chapter 26, section II, paragraph 4, sentence 4"],["God offers you the means to see his innocence.","Chapter 26, section II, paragraph 5, sentence 5"],["You deny the miracle of justice can be fair.","Chapter 26, section II, paragraph 5, sentence 8"],["God cannot be remembered until justice is loved instead of feared.","Chapter 26, section II, paragraph 8, sentence 1"],["The truth makes no decisions, for there is nothing to decide between .","Chapter 26, section III, paragraph 1, sentence 10"],["We have referred to it as the real world.","Chapter 26, section III, paragraph 3, sentence 2"],["Nothing the Son of God believes can be destroyed.","Chapter 26, section III, paragraph 4, sentence 1"],["In the real world is choosing simplified.","Chapter 26, section III, paragraph 4, sentence 10"],["Salvation stops just short of Heaven, for only perception needs salvation.","Chapter 26, section III, paragraph 5, sentence 1"],["The real world is the area of choice made real, not in the outcome, but in the perception of alternatives for choice.","Chapter 26, section III, paragraph 6, sentence 3"],["Forgiveness is this world’s equivalent of Heaven’s justice.","Chapter 26, section IV, paragraph 1, sentence 1"],["Nothing in boundless love could need forgiveness.","Chapter 26, section IV, paragraph 1, sentence 3"],["Forgiveness turns the world of sin into a world of glory, wonderful to see.","Chapter 26, section IV, paragraph 2, sentence 1"],["Each flower shines in light, and every bird sings of the joy of Heaven.","Chapter 26, section IV, paragraph 2, sentence 2"],["The holy place on which you stand is but the space that sin has left.","Chapter 26, section IV, paragraph 3, sentence 1"],["The holiest of altars is set where once sin was ! believed to be.","Chapter 26, section IV, paragraph 3, sentence 6"],["Forgiveness brings no little miracles to lay before the gate of Heaven.","Chapter 26, section IV, paragraph 4, sentence 1"],["How little is the hindrance that withholds the wealth of Heaven from you.","Chapter 26, section IV, paragraph 6, sentence 2"],["All learning is a help or hindrance to the gate of Heaven.","Chapter 26, section V, paragraph 1, sentence 5"],["You but choose whether to go toward Heaven, or away to nowhere.","Chapter 26, section V, paragraph 1, sentence 11"],["Nothing is ever lost but time, which in the end is meaningless.","Chapter 26, section V, paragraph 2, sentence 1"],["Time lasted but an instant in your mind, with no effect upon eternity.","Chapter 26, section V, paragraph 3, sentence 3"],["Forgiveness is the great release from time.","Chapter 26, section V, paragraph 6, sentence 1"],["The Son whom God created is as free as God created him.","Chapter 26, section V, paragraph 11, sentence 1"],["The shadow voices do not change the laws of time nor of eternity.","Chapter 26, section V, paragraph 12, sentence 1"],["The real world is the second part of the hallucination time and death are real, and have existence that can be perceived.","Chapter 26, section V, paragraph 12, sentence 3"],["You stand no longer on the ground that lies between the worlds.","Chapter 26, section V, paragraph 14, sentence 2"],["You stand no longer on the ground that lies between the worlds. You have gone on, and reached the world that lies at Heaven’s gate.","Chapter 26, section V, paragraph 14, sentences 2-3"],["You have gone on, and reached the world that lies at Heaven’s gate.","Chapter 26, section V, paragraph 14, sentence 3"],["Perception changes, made to take the place of changeless knowledge.","Chapter 26, section VII, paragraph 3, sentence 4"],["Illusions are illusions and are false.","Chapter 26, section VII, paragraph 6, sentence 7"],["Illusions have no witnesses and no effects.","Chapter 26, section VII, paragraph 8, sentence 3"],["Sins are beliefs that you impose between your brother and yourself.","Chapter 26, section VII, paragraph 8, sentence 7"],["Forgiveness takes away what stands between your brother and yourself.","Chapter 26, section VII, paragraph 9, sentence 1"],["Sin is belief attack can be projected outside the mind where the belief arose.","Chapter 26, section VII, paragraph 12, sentence 2"],["The miracle is possible when cause and consequence are brought together, not kept separate.","Chapter 26, section VII, paragraph 14, sentence 1"],["The healing of effect without the cause can merely shift effects to other forms.","Chapter 26, section VII, paragraph 14, sentence 2"],["The miracle but calls your ancient name, which you will recognise because the truth is in your memory.","Chapter 26, section VII, paragraph 16, sentence 1"],["Heaven is shining on the Son of God.","Chapter 26, section VII, paragraph 16, sentence 3"],["The gift of God to you is limitless.","Chapter 26, section VII, paragraph 18, sentence 4"],["A miracle can make no change at all.","Chapter 26, section VII, paragraph 20, sentence 4"],["Salvation would wipe out the space you see between you still, and let you instantly become as one.","Chapter 26, section VIII, paragraph 3, sentence 4"],["The working out of all correction takes no time at all.","Chapter 26, section VIII, paragraph 6, sentence 1"],["The change of purpose the Holy Spirit brought to your relationship has in it all effects that you will see.","Chapter 26, section VIII, paragraph 6, sentence 3"],["The Holy Spirit’s purpose now is yours.","Chapter 26, section VIII, paragraph 9, sentence 9"],["Heaven is grateful for this gift of what has been withheld so long.","Chapter 26, section IX, paragraph 5, sentence 1"],["The holiest of all the spots on earth is where an ancient hatred has become a present love.","Chapter 26, section IX, paragraph 6, sentence 1"],["An ancient miracle has come to bless and to replace an ancient enmity that came to kill.","Chapter 26, section IX, paragraph 8, sentence 5"],["You think your brother is unfair to you because you think that one must be unfair to make the other innocent.","Chapter 26, section X, paragraph 5, sentence 1"],["The Holy Spirit’s purpose is to let the Presence of your holy Guests be known to you.","Chapter 26, section X, paragraph 5, sentence 4"],["Father, unless I judge I cannot weep.","Lesson 301, paragraph 1, sentence 1"],["Father, I will not judge Your world today.","Lesson 301, paragraph 1, sentence 7"],["Father, our eyes are opening at last. Your holy world awaits us, as our sight is finally restored and we can see.","Lesson 302, paragraph 1, sentences 1-2"],["Your holy world awaits us, as our sight is finally restored and we can see.","Lesson 302, paragraph 1, sentence 2"],["Christ’s vision changes darkness into light, for fear must disappear when love has come.","Lesson 302, paragraph 1, sentence 6"],["The holy Christ is born in me today.","Lesson 303, idea of the day"],["Perception is a mirror, not a fact.","Lesson 304, paragraph 1, sentence 3"],["I would bless the world by looking on it through the eyes of Christ.","Lesson 304, paragraph 1, sentence 5"],["You lead me from the darkness to the light; from sin to holiness.","Lesson 304, paragraph 2, sentence 1"],["The gift of Christ is all I seek today.","Lesson 306, idea of the day"],["We cannot make an offering sufficient for Your Son.","Lesson 306, paragraph 2, sentence 3"],["Time’s purpose cannot be to keep the past and future one.","Lesson 308, paragraph 1, sentence 3"],["The birth of Christ is now, without a past or future.","Lesson 308, paragraph 1, sentence 6"],["Within me is the holiness of God.","Lesson 309, paragraph 1, sentence 7"],["The step I take today, my Father, is my sure release from idle dreams of sin.","Lesson 309, paragraph 2, sentence 1"],["We are restored to peace and holiness.","Lesson 310, paragraph 2, sentence 3"],["Your patients need not be physically present for you to serve them in the Name of God.","Psychotherapy, part 3, section I, paragraph 3, sentence 1"],["You can see others as well, for seeing is not limited to the body's eyes.","Psychotherapy, part 3, section I, paragraph 3, sentence 3"],["The joining is in the hands of the Holy Spirit.","Psychotherapy, part 3, section I, paragraph 3, sentence 9"],["The therapists of this world are indeed useless to the world's salvation.","Psychotherapy, part 3, section III, paragraph 3, sentence 1"],["Forgiveness, the Holy Spirit's only dream, must have no cost.","Psychotherapy, part 3, section III, paragraph 3, sentence 6"],["The right to live is something no one need fight for.","Psychotherapy, part 3, section III, paragraph 4, sentence 1"],["The Holy Spirit never refuses an invitation to enter and abide with you.","Psychotherapy, part 3, section III, paragraph 8, sentence 3"],["Creation would therefore be limited, and you would not be co-creators with God.","Chapter 7, section I, paragraph 2, sentence 2"],["God’s accomplishments are not yours, but yours are like His.","Chapter 7, section I, paragraph 2, sentence 5"],["You have the power to add to the Kingdom, though not to add to the Creator of the Kingdom.","Chapter 7, section I, paragraph 2, sentence 7"],["Your creations belong in you, as you belong in God.","Chapter 7, section I, paragraph 3, sentence 1"],["Your creations belong in you, as you belong in God. You are part of God, as your sons are part of His Sons.","Chapter 7, section I, paragraph 3, sentences 1-2"],["You are part of God, as your sons are part of His Sons.","Chapter 7, section I, paragraph 3, sentence 2"],["Your creations have always been, because you can create only as God creates.","Chapter 7, section I, paragraph 3, sentence 8"],["God does not limit His gifts in any way.","Chapter 7, section I, paragraph 4, sentence 6"],["Only joy increases forever, since joy and eternity are inseparable.","Chapter 7, section I, paragraph 5, sentence 3"],["The eternal are in peace and joy forever.","Chapter 7, section I, paragraph 5, sentence 6"],["God does not take steps, because His accomplishments are not gradual.","Chapter 7, section I, paragraph 7, sentence 1"],["Sickness and separation are not of God, but the Kingdom is.","Chapter 7, section II, paragraph 1, sentence 4"],["If you obscure the Kingdom, you are perceiving what is not of God.","Chapter 7, section II, paragraph 1, sentence 5"],["Healing does not come directly from God, Who knows His creations as perfectly whole.","Chapter 7, section IV, paragraph 1, sentence 4"],["All you need do is make the effort to learn, for the Holy Spirit has a unified goal for the effort.","Chapter 7, section IV, paragraph 3, sentence 5"],["All abilities should therefore be given over to the Holy Spirit, Who understands how to use them properly.","Chapter 7, section IV, paragraph 4, sentence 1"],["You have forgotten Him, but the Holy Spirit understands that your forgetting must be translated into a way of remembering.","Chapter 7, section IV, paragraph 4, sentence 4"],["The Holy Spirit always seeks to unify and heal.","Chapter 7, section IV, paragraph 5, sentence 3"],["As you heal you are healed, because the Holy Spirit sees no order of difficulty in healing.","Chapter 7, section IV, paragraph 5, sentence 4"],["God is All in all in a very literal sense.","Chapter 7, section IV, paragraph 7, sentence 4"],["If you teach both sickness and healing, you are both a poor teacher and a poor learner.","Chapter 7, section V, paragraph 2, sentence 7"],["Fear always makes exceptions. Healing never does.","Chapter 7, section V, paragraph 6, sentences 3-4"],["You cannot separate your Self from your Creator, Who created you by sharing His Being with you.","Chapter 7, section V, paragraph 6, sentence 15"],["The whole function idb(){return new Promise((a,b)=>{const r=indexedDB.open('acimwheel-en',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)})}
async function kvGet(k){try{const d=await idb();return await new Promise(a=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>a(q.result);q.onerror=()=>a()})}catch(e){}}
async function kvSet(k,v){try{const d=await idb();await new Promise(a=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=a;t.onerror=a})}catch(e){}}
const st=m=>$('st').textContent=m;
async function pdfLines(file,label){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent(),rows=[];
    for(const it of tc.items){if(!it.str.trim())continue;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<2.5);if(!r)rows.push(r={y,a:[]});r.a.push([x,it.str,it.width||0])}
    rows.forEach(r=>{r.a.sort((u,v)=>u[0]-v[0]);r.x0=r.a[0][0];r.x1=Math.max(...r.a.map(z=>z[0]+z[2]));let s='',pe=null;r.a.forEach(z=>{const g=pe===null?0:z[0]-pe;s+=(pe!==null&&g>1.2&&!/\s$/.test(s)&&!/^\s/.test(z[1])?' ':'')+z[1];pe=z[0]+z[2]});r.s=s});
    const rs=rows.filter(r=>!/^\s*\d{1,3}\s*$/.test(r.s)).sort((u,v)=>v.y-u.y);
    if(p>1)out.push('\u0002');
    if(!rs.length)continue;
    const xs=rs.map(r=>r.x0).sort((u,v)=>u-v),minX=xs[Math.floor(xs.length*.1)],maxW=Math.max(...rs.map(r=>r.x1-r.x0));
    const gaps=rs.slice(1).map((r,i)=>rs[i].y-r.y).filter(g=>g>0).sort((u,v)=>u-v),med=gaps[gaps.length>>1]||14;
    rs.forEach((r,i)=>{if(i&&rs[i-1].y-r.y>med*1.45)out.push('');const d=r.x0-minX;out.push((d>6&&d<40?'\u0001':'')+r.s)});
    const l=rs[rs.length-1];if(l.x1-l.x0<.88*maxW)out.push('');
    if(p%25==0){st(label+' … page '+p+' / '+doc.numPages);await new Promise(r=>setTimeout(r))}
  }
  return out;
}
$('go').onclick=async()=>{
  const fr=$('fr').files[0],pf=[...$('pdfs').files];
  if(!fr||!pf.length){st('Please choose the French wheel and the PDF files first.');return}
  $('go').disabled=true;
  try{
    st('Reading the French wheel…');
    const t=await fr.text(),i=t.indexOf('let pool=[')+9,j=t.indexOf('];',i);
    const fp=JSON.parse(t.slice(i,j+1));
    let M=null;
    for(const f of pf){
      const lines=await pdfLines(f,f.name);
      const head=lines.slice(0,60).join(' ');
      const mode=/SONG OF PRAYER/i.test(head)&&f.size<1e6?'S':/PSYCHOTHERAPY/i.test(head)&&f.size<1e6?'P':null;
      const m=parseLines(lines,mode);
      if(!M)M=m;else for(const [k,v] of m)M.set(k,v);
    }
    const r=build(M,fp);
    if(r.pool.length<300){st('Only '+r.pool.length+' lines matched. Please check that these are the right files.');$('go').disabled=false;return}
    pool=r.pool;window.__list=r.list;await kvSet('pool2',pool);
    st(pool.length+' of '+fp.length+' quotations matched.\n\nNot found ('+r.list.length+'):\n'+r.list.slice(0,80).join('\n'));
    start();
  }catch(e){st('Something went wrong: '+e.message);$('go').disabled=false}
};
function start(){$('sub').textContent=pool.length.toLocaleString('en-US')+' quotations from A Course in Miracles';$('setup').hidden=true;$('app').hidden=false;$('app').style.display='flex';$('dl').hidden=!!window.__SOLO;draw();if(window.__list&&window.__list.length){const d=document.createElement('details');d.style.cssText='margin-top:14px;max-width:560px;font-size:.85rem;color:var(--muted)';d.innerHTML='<summary>'+window.__list.length+' quotations not found (French references)</summary>';const pre=document.createElement('pre');pre.style.whiteSpace='pre-wrap';pre.textContent=window.__list.join('\n');d.appendChild(pre);$('app').appendChild(d)}}
const cv=$('wheel'),ctx=cv.getContext('2d'),N=96;
function draw(){const s=cv.clientWidth;if(!s)return;const d=devicePixelRatio||1;cv.width=cv.height=s*d;ctx.setTransform(d,0,0,d,0,0);const r=s/2,a=2*Math.PI/N;
  for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(r,r);ctx.arc(r,r,r,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);ctx.closePath();ctx.fillStyle=COLORS[i%8];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=.6;ctx.stroke()}}
addEventListener('resize',draw);
let rot=0,busy=false,flip=false,lastIdx=-1,lastT=0;
const ptr=document.querySelector('.pointer'),btn=$('spin'),res=$('result');
function confetti(){const c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=[];for(let i=0;i<120;i++)P.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*13,vy:-Math.random()*13-3,s:5+Math.random()*5,c:COLORS[i%8],r:Math.random()*6});let f=0;(function go(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(go);else x.clearRect(0,0,c.width,c.height)})()}
function show(){const it=pool[Math.floor(Math.random()*pool.length)];res.innerHTML='';
  const a=document.createElement('div');a.className='q pop';a.textContent=it[0];const b=document.createElement('div');b.className='ref pop';b.textContent=it[1];res.append(a,b);
  let z=Math.min(23,Math.max(15,Math.round(innerWidth/17)));a.style.fontSize=z+'px';while(z>13&&a.offsetHeight>z*1.3*2+3){z--;a.style.fontSize=z+'px'}}
btn.onclick=()=>{if(busy)return;busy=true;btn.disabled=true;res.innerHTML='<div class="q hint">…</div><div class="ref"></div>';
  const t=Math.floor(Math.random()*N),off=.15+Math.random()*.7,a=360/N,tm=(360-(t+off)*a)%360;let diff=tm-(rot%360);if(diff<0)diff+=360;
  const total=360*(5+Math.floor(Math.random()*3))+diff,s0=rot,t0=performance.now();
  (function step(now){const p=Math.min((now-t0)/5200,1),e=1-Math.pow(1-p,4),ang=s0+total*e;cv.style.transform='rotate('+ang+'deg)';
    const idx=Math.floor(ang/a);if(idx!==lastIdx){lastIdx=idx;if(now-lastT>45){lastT=now;flip=!flip;ptr.style.transform='translateX(-50%) rotate('+(flip?-16:0)+'deg)'}}
    if(p<1)requestAnimationFrame(step);else{rot=s0+total;busy=false;btn.disabled=false;ptr.style.transform='translateX(-50%)';show();confetti()}})(t0)};

$('dl').onclick=()=>{
  if(!pool.length)return;
  const c=document.documentElement.cloneNode(true);
  c.querySelectorAll('script[src]').forEach(x=>x.remove());
  const data=JSON.stringify(pool).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const sj=[...c.querySelectorAll('script')].find(s=>s.textContent.includes('let pool=[];'));
  sj.textContent=sj.textContent.replace('let pool=[];',()=>'window.__SOLO=1;let pool='+data+';');

  c.querySelector('#wheel').removeAttribute('style');
  const html='<!DOCTYPE html>\n'+c.outerHTML;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='wheel-of-a-course-in-miracles.html';document.body.appendChild(a);a.click();a.remove();
};
