ou have crucified God’s Son.","Chapter 13, section II, paragraph 5, sentence 1"],["You have projected guilt blindly and indiscriminately, but you have not uncovered its source.","Chapter 13, section II, paragraph 5, sentence 5"],["You are not really afraid of crucifixion.","Chapter 13, section III, paragraph 1, sentence 10"],["Your fear of attack is nothing compared to your fear of love.","Chapter 13, section III, paragraph 2, sentence 3"],["You think you have made a world God would destroy; and by loving Him, which you do, you would throw this world away, which you would .","Chapter 13, section III, paragraph 4, sentence 3"],["You would rather be a slave of the crucifixion than a Son of God in redemption.","Chapter 13, section III, paragraph 5, sentence 2"],["Beneath all the grandiosity you hold so dear is your real call for help.","Chapter 13, section III, paragraph 8, sentence 1"],["You were at peace until you asked for special favour.","Chapter 13, section III, paragraph 10, sentence 2"],["You have been as selective in your questioning as in your perception.","Chapter 13, section IV, paragraph 3, sentence 7"],["The Holy Spirit interprets time’s purpose as rendering the need for time unnecessary.","Chapter 13, section IV, paragraph 7, sentence 3"],["Healing cannot be accomplished in the past.","Chapter 13, section IV, paragraph 9, sentence 3"],["Projection makes perception, and you cannot see beyond it.","Chapter 13, section V, paragraph 3, sentence 5"],["In your madness you overlook reality completely, and you see only your own split mind everywhere you look.","Chapter 13, section V, paragraph 6, sentence 5"],["God calls you and you do not hear, for you are preoccupied with your own voice.","Chapter 13, section V, paragraph 6, sentence 6"],["Dreams disappear when light has come and you can see.","Chapter 13, section V, paragraph 8, sentence 9"],["The Holy Spirit is the Light in which Christ stands revealed.","Chapter 13, section V, paragraph 11, sentence 1"],["If you remember the past as you look upon your brother, you will be unable to perceive the reality that is now.","Chapter 13, section VI, paragraph 1, sentence 7"],["Time can release as well as imprison, depending on whose interpretation of it you use.","Chapter 13, section VI, paragraph 4, sentence 1"],["You would destroy time’s continuity by breaking it into past, present and future for your own purposes.","Chapter 13, section VI, paragraph 4, sentence 6"],["The miracle enables you to see your brother without his past, and so perceive him as born again.","Chapter 13, section VI, paragraph 5, sentence 1"],["Your past was made in anger, and if you use it to attack the present, you will not see the freedom that the present holds.","Chapter 13, section VI, paragraph 5, sentence 7"],["Judgement and condemnation are behind you, and unless you bring them with you, you will see that you are free of them.","Chapter 13, section VI, paragraph 6, sentence 1"],["God’s guiltless Son is only light.","Chapter 13, section VI, paragraph 8, sentence 4"],["The holy light that shines forth from God’s Son is the witness that his light is of his Father.","Chapter 13, section VI, paragraph 8, sentence 8"],["Each one you see in light brings your light closer to your awareness.","Chapter 13, section VI, paragraph 10, sentence 3"],["You dream of isolation because your eyes are closed.","Chapter 13, section VI, paragraph 12, sentence 6"],["God’s Son is still as loving as his Father.","Chapter 13, section VI, paragraph 13, sentence 5"],["Both are not true, yet either one will seem as real to you as the amount to which you hold it dear.","Chapter 13, section VII, paragraph 2, sentence 4"],["The peace of God passeth your understanding only in the past.","Chapter 13, section VII, paragraph 8, sentence 1"],["God loves His Son forever, and His Son returns his Father’s Love forever.","Chapter 13, section VII, paragraph 8, sentence 3"],["The real world is the way that leads you to remembrance of the one thing that is wholly true and wholly yours.","Chapter 13, section VII, paragraph 8, sentence 4"],["Your first exchange of what you made for what you want is the exchange of nightmares for the happy dreams of love.","Chapter 13, section VII, paragraph 9, sentence 2"],["Knowledge needs no correction.","Chapter 13, section VII, paragraph 9, sentence 4"],["Your Father knoweth that you have need of nothing.","Chapter 13, section VII, paragraph 10, sentence 2"],["In your world you do need things.","Chapter 13, section VII, paragraph 10, sentence 4"],["Without the Holy Spirit the answer would be no.","Chapter 13, section VII, paragraph 10, sentence 7"],["Everything the ego tells you that you need will hurt you.","Chapter 13, section VII, paragraph 11, sentence 1"],["Only the Holy Spirit knows what you need.","Chapter 13, section VII, paragraph 12, sentence 1"],["God’s Son is not a traveller through outer worlds.","Chapter 13, section VII, paragraph 13, sentence 5"],["You are an aspect of knowledge, being in the Mind of God, Who knows you.","Chapter 13, section VIII, paragraph 2, sentence 3"],["The separation is merely a faulty formulation of reality, with no effect at all.","Chapter 13, section VIII, paragraph 3, sentence 5"],["The miracle, without a function in Heaven, is needful here.","Chapter 13, section VIII, paragraph 3, sentence 6"],["Apart from the Father and the Son, the Holy Spirit has no function.","Chapter 13, section VIII, paragraph 4, sentence 1"],["Every miracle you offer to the Son of God is but the true perception of one aspect of the whole.","Chapter 13, section VIII, paragraph 5, sentence 2"],["The only miracle that ever was is God’s most holy Son, created in the one Reality that is his Father.","Chapter 13, section VIII, paragraph 6, sentence 5"],["The Holy Spirit knows your part in the redemption, and who are seeking you and where to find them.","Chapter 13, section VIII, paragraph 7, sentence 3"],["The holy light you saw outside yourself, in every miracle you offered to your brothers, will be returned to you.","Chapter 13, section VIII, paragraph 8, sentence 4"],["As miracles in this world join you to your brothers, so do your creations establish your fatherhood in Heaven.","Chapter 13, section VIII, paragraph 9, sentence 1"],["The miracle that God created is perfect, as are the miracles that you established in His Name.","Chapter 13, section VIII, paragraph 9, sentence 4"],["Guilt remains the only thing that hides the Father, for guilt is the attack upon His Son.","Chapter 13, section IX, paragraph 1, sentence 1"],["The ego’s laws are strict, and breaches are severely punished.","Chapter 13, section IX, paragraph 1, sentence 4"],["Release from guilt is the ego’s whole undoing.","Chapter 13, section IX, paragraph 2, sentence 1"],["In every condemnation that you offer the Son of God lies the conviction of your own guilt.","Chapter 13, section IX, paragraph 6, sentence 2"],["If you would have the Holy Spirit make you free of it, accept His offer of Atonement for all your brothers.","Chapter 13, section IX, paragraph 6, sentence 3"],["Guilt makes you blind, for while you see one spot of guilt within you, you will not see the light.","Chapter 13, section IX, paragraph 7, sentence 1"],["If you would look within you would see only the Atonement, shining in quiet and in peace upon the altar to your Father.","Chapter 13, section IX, paragraph 7, sentence 6"],["Within you is the holy sign of perfect faith your Father has in you.","Chapter 13, section IX, paragraph 8, sentence 7"],["You wanted not salvation in the past.","Chapter 13, section X, paragraph 4, sentence 7"],["The Holy Spirit seeks not to dispel reality.","Chapter 13, section X, paragraph 6, sentence 4"],["In shining peace within you is the perfect purity in which you were created.","Chapter 13, section X, paragraph 9, sentence 4"],["You can love only as God loves.","Chapter 13, section X, paragraph 11, sentence 4"],["In Heaven is everything God values, and nothing else.","Chapter 13, section XI, paragraph 3, sentence 7"],["In Heaven is everything God values, and nothing else. Heaven is perfectly unambiguous.","Chapter 13, section XI, paragraph 3, sentences 7-8"],["Perfect perception can merely show you what is capable of being wholly shared.","Chapter 13, section XI, paragraph 4, sentence 2"],["Nothing can prevent what God would have accomplished from accomplishment.","Chapter 13, section XI, paragraph 5, sentence 3"],["You will not remember change and shift in Heaven.","Chapter 13, section XI, paragraph 6, sentence 1"],["You will not remember change and shift in Heaven. You have need of contrast only here.","Chapter 13, section XI, paragraph 6, sentences 1-2"],["The Will of God can fail in nothing.","Chapter 13, section XI, paragraph 6, sentence 9"],["Your wildest misperceptions, your weird imaginings, your blackest nightmares all mean nothing.","Chapter 13, section XI, paragraph 7, sentence 2"],["The Holy Spirit will restore your sanity because insanity is not the Will of God.","Chapter 13, section XI, paragraph 7, sentence 4"],["The Holy Spirit knows only of His Will.","Chapter 13, section XI, paragraph 8, sentence 8"],["You will learn salvation because you will learn how to save.","Chapter 13, section XI, paragraph 9, sentence 1"],["Salvation is as sure as God.","Chapter 13, section XI, paragraph 9, sentence 3"],["The Holy Spirit will undo for you everything you have learned that teaches that what is not true must be reconciled with truth.","Chapter 13, section XI, paragraph 11, sentence 1"],["Death is the central dream from which all illusions stem.","Manual for Teachers, question 27, introduction, paragraph 1, sentence 1"],["Death has become life’s symbol.","Manual for Teachers, question 27, introduction, paragraph 2, sentence 6"],["Death is the symbol of the fear of God.","Manual for Teachers, question 27, introduction, paragraph 3, sentence 1"],["Without the idea of death there is no world.","Manual for Teachers, question 27, introduction, paragraph 6, sentence 3"],["Without the idea of death there is no world. All dreams will end with this one.","Manual for Teachers, question 27, introduction, paragraph 6, sentences 3-4"],["Truth neither moves nor wavers nor sinks down to death and dissolution.","Manual for Teachers, question 27, introduction, paragraph 7, sentence 6"],["Forgiveness is the home of miracles.","Workbook Part II, section 13, paragraph 3, sentence 1"],["Each lily of forgiveness offers all the world the silent miracle of love.","Workbook Part II, section 13, paragraph 3, sentence 4"],["I let forgiveness rest upon all things, For thus forgiveness will be given me.","Lesson 342, idea of the day"],["The key is in my hand, and I have reached the door beyond which lies the end of dreams.","Lesson 342, paragraph 1, sentence 4"],["I stand before the gate of Heaven, wondering if I should enter in and be at home.","Lesson 342, paragraph 1, sentence 5"],["The end of suffering can not be loss.","Lesson 343, paragraph 1, sentence 1"],["I am complete because I am Your Son.","Lesson 343, paragraph 1, sentence 10"],["I am complete because I am Your Son. I cannot lose, for I can only give, and everything is mine eternally.","Lesson 343, paragraph 1, sentences 10-11"],["I cannot lose, for I can only give, and everything is mine eternally.","Lesson 343, paragraph 1, sentence 11"],["The mercy and the peace of God are free.","Lesson 343, paragraph 2, sentence 1"],["The mercy and the peace of God are free. Salvation has no cost.","Lesson 343, paragraph 2, sentences 1-2"],["How near we are to one another, as we go to God.","Lesson 344, paragraph 2, sentence 1"],["Father, a miracle reflects Your gifts to me, Your Son.","Lesson 345, paragraph 1, sentence 1"],["The miracles I give are given back in just the form I need to help me with the problems I perceive.","Lesson 345, paragraph 1, sentence 4"],["The light has come to offer miracles to bless the tired world.","Lesson 345, paragraph 2, sentence 2"],["Father, I wake today with miracles correcting my perception of all things.","Lesson 346, paragraph 1, sentence 1"],["I do not seek the things of time, and so I will not look upon them.","Lesson 346, paragraph 1, sentence 3"],["I would forget all things except Your Love.","Lesson 346, paragraph 1, sentence 5"],["I would forget all things except Your Love. I would abide in You, and know no laws except Your law of love.","Lesson 346, paragraph 1, sentences 5-6"],["I would abide in You, and know no laws except Your law of love.","Lesson 346, paragraph 1, sentence 6"],["Anger must come from judgement.","Lesson 347, idea of the day"],["Father, I want what goes against my will, and do not want what is my will to have.","Lesson 347, paragraph 1, sentence 1"],["I have no cause for anger or for fear, For You surround me.","Lesson 348, idea of the day"],["Surrounding me is everlasting Love.","Lesson 348, paragraph 1, sentence 2"],["Miracles mirror God’s eternal Love.","Lesson 350, idea of the day"],["The final Judgement on the world contains no condemnation.","Workbook Part II, section 10, paragraph 2, sentence 1"],["Judgement was made to be a weapon used against the truth.","Lesson 311, paragraph 1, sentence 1"],["We do not know him, and we cannot judge.","Lesson 311, paragraph 2, sentence 2"],["I have no purpose for today except to look upon a liberated world, set free from all the judgements I have made.","Lesson 312, paragraph 2, sentence 1"],["The eyes of Christ look on a world forgiven.","Lesson 313, paragraph 1, sentence 4"],["How holy and how loving! Brother, come and join with me today.","Lesson 313, paragraph 2, sentences 3-4"],["Brother, come and join with me today.","Lesson 313, paragraph 2, sentence 4"],["Brother, come and join with me today. We save the world when we have joined.","Lesson 313, paragraph 2, sentences 4-5"],["We save the world when we have joined.","Lesson 313, paragraph 2, sentence 5"],["All gifts my brothers give belong to me.","Lesson 315, idea of the day"],["A brother smiles upon another, and my heart is gladdened.","Lesson 315, paragraph 1, sentence 3"],["I thank You, Father, for the many gifts that come to me today and every day from every Son of God.","Lesson 315, paragraph 2, sentence 1"],["All gifts I give my brothers are my own.","Lesson 316, idea of the day"],["Father, I would accept Your gifts today.","Lesson 316, paragraph 2, sentence 1"],["Father, Your way is what I choose today.","Lesson 317, paragraph 2, sentence 1"],["In me salvation’s means and end are one.","Lesson 318, idea of the day"],["In me, God’s holy Son, are reconciled all parts of Heaven’s plan to save the world.","Lesson 318, paragraph 1, sentence 1"],["I am the goal the world is searching for.","Lesson 318, paragraph 1, sentence 6"],["I am the goal the world is searching for. I am God’s Son, His one eternal Love.","Lesson 318, paragraph 1, sentences 6-7"],["I am God’s Son, His one eternal Love.","Lesson 318, paragraph 1, sentence 7"],["I am God’s Son, His one eternal Love. I am salvation’s means and end as well.","Lesson 318, paragraph 1, sentences 7-8"],["I am salvation’s means and end as well.","Lesson 318, paragraph 1, sentence 8"],["Let me today, my Father, take the role You offer me in Your request that I accept Atonement for myself.","Lesson 318, paragraph 2, sentence 1"],["I came for the salvation of the world.","Lesson 319, idea of the day"],["My Father gives all power unto me.","Lesson 320, idea of the day"],["I am he in whom the power of my Father’s Will abides.","Lesson 320, paragraph 1, sentence 6"],["Your Will can do all things in me, and then extend to all the world as well through me.","Lesson 320, paragraph 2, sentence 1"],["No one in this world escapes fear, but everyone can reconsider its causes and learn to evaluate them correctly.","Psychotherapy, part 1, introduction, paragraph 1, sentence 3"],["The patient need not think of truth as God in order to make progress in salvation.","Psychotherapy, part 1, introduction, paragraph 5, sentence 1"],["Indirect proof of truth is needed in a world made of denial and without direction.","Chapter 14, section I, paragraph 2, sentence 1"],["If you decide to have and give and be nothing except a dream, you must direct your thoughts unto oblivion.","Chapter 14, section I, paragraph 2, sentence 4"],["Any direction that would lead you where the Holy Spirit leads you not, goes nowhere.","Chapter 14, section I, paragraph 4, sentence 1"],["The Holy Spirit needs a happy learner, in whom His mission can be happily accomplished.","Chapter 14, section II, paragraph 1, sentence 1"],["Simplicity is very difficult for twisted minds.","Chapter 14, section II, paragraph 2, sentence 3"],["Like you, the Holy Spirit did not make truth.","Chapter 14, section II, paragraph 4, sentence 1"],["You need not understand creation to do what must be done before that knowledge would be meaningful to you.","Chapter 14, section IV, paragraph 4, sentence 1"],["The Holy Spirit will not delay in answering your every question what to do.","Chapter 14, section IV, paragraph 6, sentence 4"],["Communication with God is life.","Chapter 14, section IV, paragraph 10, sentence 6"],["The only part of your mind that has reality is the part that links you still with God.","Chapter 14, section V, paragraph 1, sentence 1"],["The happy learners of the Atonement become the teachers of the innocence that is the right of all that God created.","Chapter 14, section V, paragraph 3, sentence 7"],["We are all joined in the Atonement here, and nothing else can unite us in this world.","Chapter 14, section V, paragraph 5, sentence 1"],["The miracle acknowledges the guiltlessness that must have been denied to produce the need of healing.","Chapter 14, section V, paragraph 5, sentence 3"],["The circle of Atonement has no end.","Chapter 14, section V, paragraph 7, sentence 6"],["Peace, then, be unto everyone who becomes a teacher of peace.","Chapter 14, section V, paragraph 8, sentence 1"],["Joy is its unifying attribute, with no one left outside to suffer guilt alone.","Chapter 14, section V, paragraph 8, sentence 4"],["The power of God draws everyone to its safe embrace of love and union.","Chapter 14, section V, paragraph 8, sentence 5"],["Our power comes not of us, but of our Father.","Chapter 14, section V, paragraph 9, sentence 2"],["The crucifixion had no part in the Atonement.","Chapter 14, section V, paragraph 10, sentence 1"],["Crucifixion is always the ego’s aim.","Chapter 14, section V, paragraph 10, sentence 6"],["The power of love is in His gentleness, which is of God and therefore cannot crucify nor suffer crucifixion.","Chapter 14, section V, paragraph 10, sentence 9"],["The journey that we undertake together is the exchange of dark for light, of ignorance for understanding.","Chapter 14, section VI, paragraph 1, sentence 1"],["Nothing you understand is fearful.","Chapter 14, section VI, paragraph 1, sentence 2"],["Death yields to life simply because destruction is not true.","Chapter 14, section VI, paragraph 4, sentence 1"],["You have regarded the separation as a means for breaking your communication with your Father.","Chapter 14, section VI, paragraph 5, sentence 1"],["The Holy Spirit reinterprets it as a means of re-establishing what was not broken, but has been made obscure.","Chapter 14, section VI, paragraph 5, sentence 2"],["The Holy Spirit’s function is entirely communication.","Chapter 14, section VI, paragraph 8, sentence 1"],["Its gates are open wide to greet His Son.","Chapter 14, section VI, paragraph 8, sentence 7"],["Light or darkness, knowledge or ignorance are yours, but not both.","Chapter 14, section VII, paragraph 1, sentence 2"],["In union, everything that is not real must disappear, for truth is union.","Chapter 14, section VII, paragraph 1, sentence 5"],["As darkness disappears in light, so ignorance fades away when knowledge dawns.","Chapter 14, section VII, paragraph 1, sentence 6"],["Perception is the medium by which ignorance is brought to knowledge.","Chapter 14, section VII, paragraph 1, sentence 7"],["The search for truth is but the honest searching out of everything that interferes with truth.","Chapter 14, section VII, paragraph 2, sentence 1"],["To God, unknowing is impossible.","Chapter 14, section VII, paragraph 3, sentence 5"],["Light cannot enter darkness when a mind believes in darkness, and will not let it go.","Chapter 14, section VII, paragraph 5, sentence 1"],["Truth does not struggle against ignorance, and love does not attack fear.","Chapter 14, section VII, paragraph 5, sentence 2"],["You cannot, then, offer it to His Son.","Chapter 14, section VIII, paragraph 2, sentence 6"],["The holy meeting place of the un-separated Father and His Son lies in the Holy Spirit and in you.","Chapter 14, section VIII, paragraph 2, sentence 13"],["Unbroken and uninterrupted love flows constantly between the Father and the Son, as both would have it be.","Chapter 14, section VIII, paragraph 2, sentence 15"],["God’s glory and His Son’s belong to you in truth.","Chapter 14, section VIII, paragraph 3, sentence 7"],["Where God is, there are you.","Chapter 14, section VIII, paragraph 4, sentence 4"],["Nothing can change the knowledge, given you by God, into unknowingness.","Chapter 14, section VIII, paragraph 4, sentence 6"],["Nothing can change the knowledge, given you by God, into unknowingness. Everything God created knows its Creator.","Chapter 14, section VIII, paragraph 4, sentences 6-7"],["Everything God created knows its Creator.","Chapter 14, section VIII, paragraph 4, sentence 7"],["You are not frail with God beside you.","Chapter 14, section IX, paragraph 3, sentence 3"],["The Holy Spirit holds it there for you.","Chapter 14, section IX, paragraph 3, sentence 7"],["The Holy Spirit holds it there for you. God has not left His altar, though His worshippers placed other gods upon it.","Chapter 14, section IX, paragraph 3, sentences 7-8"],["God has not left His altar, though His worshippers placed other gods upon it.","Chapter 14, section IX, paragraph 3, sentence 8"],["The temple still is holy, for the Presence that dwells within it is holiness.","Chapter 14, section IX, paragraph 3, sentence 9"],["In the temple, holiness waits quietly for the return of them that love it.","Chapter 14, section IX, paragraph 4, sentence 1"],["In this world you can become a spotless mirror, in which the holiness of your Creator shines forth from you to all around you.","Chapter 14, section IX, paragraph 5, sentence 1"],["Earth can reflect Heaven or hell; God or the ego.","Chapter 14, section IX, paragraph 5, sentence 4"],["You need but leave the mirror clean and clear of all the images of hidden darkness you have drawn upon it.","Chapter 14, section IX, paragraph 5, sentence 5"],["Reflections are seen in light.","Chapter 14, section IX, paragraph 6, sentence 1"],["The reflection of God needs no interpretation.","Chapter 14, section IX, paragraph 6, sentence 3"],["The reflections you accept into the mirror of your mind in time but bring eternity nearer or farther.","Chapter 14, section X, paragraph 1, sentence 2"],["In Heaven reality is shared and not reflected.","Chapter 14, section X, paragraph 2, sentence 1"],["By sharing its reflection here, its truth becomes the only perception the Son of God accepts.","Chapter 14, section X, paragraph 2, sentence 2"],["The miracle is the one thing you can do that transcends order, being based not on differences but on equality.","Chapter 14, section X, paragraph 2, sentence 7"],["Miracles are not in competition, and the number of them that you can do is limitless.","Chapter 14, section X, paragraph 3, sentence 1"],["To the ego, if the form is acceptable the content must be.","Chapter 14, section X, paragraph 8, sentence 2"],["Nothing lives in secret, and what you would hide from the Holy Spirit is nothing.","Chapter 14, section X, paragraph 11, sentence 3"],["Every interpretation you would lay upon a brother is senseless.","Chapter 14, section X, paragraph 11, sentence 4"],["Knowledge is power, and all power is of God.","Chapter 14, section XI, paragraph 1, sentence 2"],["You need only recognise that everything you learned you do not want.","Chapter 14, section XI, paragraph 6, sentence 4"],["The curriculum is highly individualised, and all aspects are under the Holy Spirit’s particular care and guidance.","Manual for Teachers, question 29, introduction, paragraph 2, sentence 6"],["The Holy Spirit knows the truth about you.","Manual for Teachers, question 29, introduction, paragraph 4, sentence 6"],["God turns to you for help to save the world.","Manual for Teachers, question 29, introduction, paragraph 8, sentence 2"],["Through you is ushered in A world unseen, unheard, yet truly there.","Manual for Teachers, question 29, introduction, paragraph 8, sentence 5"],["Holy are you, and in your light the world Reflects your holiness, for you are not Alone and friendless.","Manual for Teachers, question 29, introduction, paragraph 8, sentence 6"],["Let me be still before my holiness.","Lesson 81, paragraph 1, sentence 2"],["Let me, then, forgive the world, that it may be healed along with me.","Lesson 82, paragraph 1, sentence 4"],["I have no function but the one God gave me.","Lesson 83, paragraph 1, sentence 1"],["This recognition releases me from all conflict, because it means I cannot have conflicting goals.","Lesson 83, paragraph 1, sentence 2"],["More specific applications of this idea might take these forms: My perception of this does not change my function.","Lesson 83, paragraph 1, sentence 5"],["I am in the likeness of my Creator.","Lesson 84, paragraph 1, sentence 6"],["Recognising this, what do I want my grievances for?","Lesson 85, paragraph 1, sentence 2"],["I want to see, and this will be the means by which I will succeed.","Lesson 85, paragraph 1, sentence 6"],["It is senseless for me to search wildly about for salvation.","Lesson 86, paragraph 1, sentence 1"],["I would no longer defeat my own best interests in this insane way.","Lesson 86, paragraph 3, sentence 4"],["And I invite the solution to come to me through my forgiveness of the grievance, and my welcome of the miracle that takes its place.","Lesson 90, paragraph 1, sentence 5"],["Miracles are seen in light.","Lesson 91, idea of the day"],["To you, then, light is crucial.","Lesson 91, paragraph 2, sentence 1"],["Denial of light leads to failure to perceive it.","Lesson 91, paragraph 2, sentence 5"],["You do not doubt that the body’s eyes can see.","Lesson 91, paragraph 3, sentence 3"],["Your faith lies in the darkness, not the light.","Lesson 91, paragraph 3, sentence 5"],["The miracles your sense of weakness hides will leap into awareness as you feel the strength in you.","Lesson 91, paragraph 4, sentence 5"],["Faith goes to what you want, and you instruct your mind accordingly.","Lesson 91, paragraph 5, sentence 3"],["You can escape the body if you choose.","Lesson 91, paragraph 5, sentence 5"],["Miracles are seen in light, and light and strength are one.","Lesson 92, idea of the day"],["You do not think of light in terms of strength, and darkness in terms of weakness.","Lesson 92, paragraph 1, sentence 2"],["You also believe the body’s brain can think.","Lesson 92, paragraph 2, sentence 1"],["Light and joy and peace abide in me.","Lesson 93, idea of the day"],["You think you are the home of evil, darkness and sin.","Lesson 93, paragraph 1, sentence 1"],["The self you made is not the Son of God.","Lesson 93, paragraph 5, sentence 1"],["Nothing can touch it, or change what God created as eternal.","Lesson 93, paragraph 6, sentence 5"],["Nothing can touch it, or change what God created as eternal. The self you made, evil and full of sin, is meaningless.","Lesson 93, paragraph 6, sentences 5-6"],["The self you made, evil and full of sin, is meaningless.","Lesson 93, paragraph 6, sentence 6"],["Salvation requires the acceptance of but one thought; — you are as God created you, not what you made of yourself.","Lesson 93, paragraph 7, sentence 1"],["Light and joy and peace abide in you because God put them there.","Lesson 93, paragraph 7, sentence 7"],["You are what God created or what you made.","Lesson 93, paragraph 9, sentence 1"],["You are what God created or what you made. One Self is true; the other is not there.","Lesson 93, paragraph 9, sentences 1-2"],["One Self is true; the other is not there.","Lesson 93, paragraph 9, sentence 2"],["If you remain as God created you, you must be strong and light must be in you.","Lesson 94, paragraph 2, sentence 2"],["You are as God created you. Darkness cannot obscure the glory of God’s Son.","Lesson 94, paragraph 2, sentences 4-5"],["Darkness cannot obscure the glory of God’s Son.","Lesson 94, paragraph 2, sentence 5"],["I am one Self, united with my Creator.","Lesson 95, idea of the day"],["You have seen the extent of your lack of mental discipline, and of your need for mind training.","Lesson 95, paragraph 4, sentence 4"],["The Holy Spirit is not delayed in His teaching by your mistakes.","Lesson 95, paragraph 8, sentence 1"],["Salvation comes from my one Self.","Lesson 96, idea of the day"],["A mind and body cannot both exist.","Lesson 96, paragraph 3, sentence 4"],["Spirit makes use of mind as means to find its Self expression.","Lesson 96, paragraph 4, sentence 1"],["Every time you spend five minutes of the hour seeking Him Who joins your mind and Self, you offer Him another treasure to be kept for you.","Lesson 96, paragraph 10, sentence 5"],["You are the spirit lovingly endowed with all your Father’s Love and peace and joy.","Lesson 97, paragraph 2, sentence 2"],["We side with truth and let illusions go.","Lesson 98, paragraph 1, sentence 3"],["We dedicate ourselves to truth today, and to salvation as God planned it be.","Lesson 98, paragraph 1, sentence 5"],["You can exchange a little of your time for peace of mind and certainty of purpose, with the promise of complete success.","Lesson 98, paragraph 6, sentence 2"],["Salvation is my only function here.","Lesson 99, idea of the day"],["Salvation and forgiveness are the same.","Lesson 99, paragraph 1, sentence 1"],["Salvation is your function, with the One to Whom the plan was given.","Lesson 99, paragraph 6, sentence 4"],["You cannot lose the gifts your Father gave.","Lesson 99, paragraph 10, sentence 2"],["You cannot lose the gifts your Father gave. You do not want to be another self.","Lesson 99, paragraph 10, sentences 2-3"],["You do not want to be another self.","Lesson 99, paragraph 10, sentence 3"],["You do not want to be another self. You have no function that is not of God.","Lesson 99, paragraph 10, sentences 3-4"],["You have no function that is not of God.","Lesson 99, paragraph 10, sentence 4"],["Forgiveness and salvation are the same.","Lesson 99, paragraph 10, sentence 6"],["My part is essential to God’s plan for salvation.","Lesson 100, idea of the day"],["God’s Will for you is perfect happiness.","Lesson 100, paragraph 2, sentence 1"],["You are indeed essential to God’s plan.","Lesson 100, paragraph 3, sentence 1"],["Sadness is the sign that you would play another part, instead of what has been assigned to you by God.","Lesson 100, paragraph 5, sentence 3"],["If you are sad, your part is unfulfilled, and all the world is thus deprived of joy, along with you.","Lesson 100, paragraph 6, sentence 2"],["You are God’s messenger today.","Lesson 100, paragraph 6, sentence 4"],["God’s Will for me is perfect happiness.","Lesson 101, idea of the day"],["If sin is real, then punishment is just and cannot be escaped.","Lesson 101, paragraph 2, sentence 1"],["If sin is real, salvation must be pain.","Lesson 101, paragraph 3, sentence 1"],["God’s Will for you is perfect happiness because there is no sin, and suffering is causeless.","Lesson 101, paragraph 6, sentence 1"],["Joy is just, and pain is but the sign you have misunderstood yourself.","Lesson 101, paragraph 6, sentence 2"],["I share God’s Will for happiness for me.","Lesson 102, idea of the day"],["God, being Love, is also happiness.","Lesson 103, idea of the day"],["Happiness is an attribute of love.","Lesson 103, paragraph 1, sentence 1"],["I seek but what belongs to me in truth.","Lesson 104, idea of the day"],["God’s peace and joy are mine.","Lesson 105, idea of the day"],["God’s peace and joy are yours.","Lesson 105, paragraph 1, sentence 1"],["Thus you prepare yourself to recognise God’s gifts to you, and let your mind be free of all that would prevent success today.","Lesson 105, paragraph 8, sentence 1"],["For each five minutes spent in listening, a thousand minds are opened to the truth and they will hear, the holy Word you hear.","Lesson 106, paragraph 8, sentence 2"],["Truth will correct all errors in my mind.","Lesson 107, idea of the day"],["Truth occupies your mind completely, liberating you from all beliefs in the ephemeral.","Lesson 107, paragraph 3, sentence 4"],["You were not meant to suffer and to die.","Lesson 107, paragraph 6, sentence 7"],["True light that makes true vision possible is not the light the body’s eyes behold.","Lesson 108, paragraph 2, sentence 1"],["One thought, completely unified, will serve to unify all thought.","Lesson 108, paragraph 5, sentence 1"],["Then close your eyes, and for five minutes think of what you would hold out to everyone, to have it yours.","Lesson 108, paragraph 8, sentence 3"],["We ask for rest today, and quietness unshaken by the world’s appearances.","Lesson 109, paragraph 1, sentence 1"],["We ask for peace and stillness, in the midst of all the turmoil born of clashing dreams.","Lesson 109, paragraph 1, sentence 2"],["You rest in God, and while the world is torn by winds of hate your rest remains completely undisturbed.","Lesson 109, paragraph 4, sentence 2"],["Yours is the rest of truth.","Lesson 109, paragraph 4, sentence 3"],["In timelessness you rest, while time goes by without its touch upon you, for your rest can never change in any way at all.","Lesson 109, paragraph 5, sentence 2"],["You rest within the peace of God today, quiet and unafraid.","Lesson 109, paragraph 9, sentence 1"],["You rest within the peace of God today, quiet and unafraid. Each brother comes to take his rest, and offer it to you.","Lesson 109, paragraph 9, sentences 1-2"],["Each brother comes to take his rest, and offer it to you.","Lesson 109, paragraph 9, sentence 2"],["Time is not the guardian of what we give today.","Lesson 109, paragraph 9, sentence 4"],["You need no thought but just this one, to let redemption come to light the world and free it from the past.","Lesson 110, paragraph 3, sentence 3"],["Because of your likeness to your Creator you are creative.","Chapter 2, section I, paragraph 1, sentence 5"],["You can and should deny any belief that error can hurt you.","Chapter 2, section II, paragraph 2, sentence 2"],["Denial of error is a strong defence of truth, but denial of truth results in miscreation, the projections of the ego.","Chapter 2, section II, paragraph 2, sentence 5"],["In the service of the right mind the denial of error frees the mind, and re- establishes the freedom of the will.","Chapter 2, section II, paragraph 2, sentence 6"],["You can defend truth as well as error.","Chapter 2, section II, paragraph 3, sentence 1"],["The Atonement principle was in effect long before the Atonement began.","Chapter 2, section II, paragraph 4, sentence 2"],["The principle was love and the Atonement was an act of love.","Chapter 2, section II, paragraph 4, sentence 3"],["Acts were not necessary before the separation, because belief in space and time did not exist.","Chapter 2, section II, paragraph 4, sentence 4"],["You can learn to improve your perceptions and can become a better and better learner.","Chapter 2, section II, paragraph 5, sentence 6"],["Spiritual vision literally cannot see error, and merely looks for Atonement.","Chapter 2, section III, paragraph 4, sentence 1"],["The children of God are entitled to the perfect comfort that comes from perfect trust.","Chapter 2, section III, paragraph 5, sentence 1"],["God and His creations are completely dependent on Each Other.","Chapter 2, section III, paragraph 5, sentence 6"],["Whenever you are afraid you are deceived, and your mind cannot serve the Holy Spirit.","Chapter 2, section III, paragraph 5, sentence 9"],["The miracle is the means, the Atonement is the principle, and healing is the result.","Chapter 2, section IV, paragraph 1, sentence 2"],["The kind of error to which Atonement is applied is irrelevant.","Chapter 2, section IV, paragraph 1, sentence 6"],["You do not understand healing because of your own fear.","Chapter 2, section IV, paragraph 1, sentence 9"],["A major step in the Atonement plan is to undo error at all levels.","Chapter 2, section IV, paragraph 2, sentence 1"],["Only the mind is capable of error. The body can act wrongly only when it is responding to misthought.","Chapter 2, section IV, paragraph 2, sentences 4-5"],["The body can act wrongly only when it is responding to misthought.","Chapter 2, section IV, paragraph 2, sentence 5"],["Only the mind can create because spirit has already been created, and the body is a learning device of the mind.","Chapter 2, section IV, paragraph 3, sentence 1"],["The body is merely part of your experience in the physical world.","Chapter 2, section IV, paragraph 3, sentence 8"],["All material means that you accept as remedies for bodily ills are restatements of magic principles.","Chapter 2, section IV, paragraph 4, sentence 1"],["The whole aim of the miracle is to raise the level of communication, not to lower it by increasing fear.","Chapter 2, section IV, paragraph 5, sentence 6"],["The body does not exist except as a learning device for the mind.","Chapter 2, section V, paragraph 1, sentence 9"],["Magic is the mindless or the miscreative use of mind.","Chapter 2, section V, paragraph 2, sentence 1"],["Corrective learning always begins with the awakening of spirit, and the turning away from the belief in physical sight.","Chapter 2, section V, paragraph 7, sentence 1"],["Discomfort is aroused only to bring the need for correction into awareness.","Chapter 2, section V, paragraph 7, sentence 8"],["Most of the loftier concepts of which you are capable now are time-dependent.","Chapter 2, section V, paragraph 9, sentence 5"],["The miracle, as an expression of charity, can only shorten it.","Chapter 2, section V, paragraph 10, sentence 6"],["There is no reference to the outcome of the error.","Chapter 2, section V, paragraph 17, sentence 6"],["The presence of fear shows that you have raised body thoughts to the level of the mind.","Chapter 2, section VI, paragraph 1, sentence 6"],["You do not need guidance except at the mind level.","Chapter 2, section VI, paragraph 3, sentence 5"],["The correction of fear is your responsibility.","Chapter 2, section VI, paragraph 4, sentence 1"],["The particular result does not matter, but the fundamental error does.","Chapter 2, section VI, paragraph 4, sentence 7"],["Your mind is therefore split, and your behaviour inevitably becomes erratic.","Chapter 2, section VI, paragraph 5, sentence 9"],["The Holy Spirit cannot ask more than you are willing to do.","Chapter 2, section VI, paragraph 6, sentence 2"],["Only your mind can produce fear.","Chapter 2, section VI, paragraph 6, sentence 7"],["You may still complain about fear, but you nevertheless persist in making yourself fearful.","Chapter 2, section VII, paragraph 1, sentence 1"],["Both miracles and fear come from thoughts.","Chapter 2, section VII, paragraph 3, sentence 1"],["If you are not free to choose one, you would also not be free to choose the other.","Chapter 2, section VII, paragraph 3, sentence 2"],["By choosing the miracle you have rejected fear, if only temporarily.","Chapter 2, section VII, paragraph 3, sentence 3"],["By choosing the miracle you have rejected fear, if only temporarily. You have been fearful of everyone and everything.","Chapter 2, section VII, paragraph 3, sentences 3-4"],["You have been fearful of everyone and everything.","Chapter 2, section VII, paragraph 3, sentence 4"],["The fundamental conflict in this world, then, is between creation and miscreation.","Chapter 2, section VII, paragraph 3, sentence 13"],["Fear is really nothing and love is everything.","Chapter 2, section VII, paragraph 5, sentence 3"],["Fear is really nothing and love is everything. Whenever light enters darkness, the darkness is abolished.","Chapter 2, section VII, paragraph 5, sentences 3-4"],["Whenever light enters darkness, the darkness is abolished.","Chapter 2, section VII, paragraph 5, sentence 4"],["If all His creations are His Sons, every one must be an integral part of the whole Sonship.","Chapter 2, section VII, paragraph 6, sentence 2"],["The Last Judgement is one of the most threatening ideas in your thinking.","Chapter 2, section VIII, paragraph 2, sentence 1"],["Judgement is not an attribute of God.","Chapter 2, section VIII, paragraph 2, sentence 3"],["The Last Judgement is generally thought of as a procedure undertaken by God.","Chapter 2, section VIII, paragraph 3, sentence 1"],["The Last Judgement might be called a process of right evaluation.","Chapter 2, section VIII, paragraph 3, sentence 5"],["The body is a fence the Son of God imagines he has built, to separate parts of his Self from other parts.","Workbook Part II, section 5, paragraph 1, sentence 1"],["The body is the means by which God’s Son returns to sanity.","Workbook Part II, section 5, paragraph 4, sentence 1"],["Your safety lies in truth, and not in lies.","Workbook Part II, section 5, paragraph 5, sentence 3"],["God is my refuge and security.","Lesson 261, idea of the day"],["I would come, my Father, home to You today.","Lesson 261, paragraph 2, sentence 2"],["I choose to be as You created me, and find the Son whom You created as my Self.","Lesson 261, paragraph 2, sentence 3"],["My holy vision sees all things as pure.","Lesson 263, idea of the day"],["I would not perceive such dark and fearful images.","Lesson 263, paragraph 1, sentence 3"],["I am surrounded by the Love of God.","Lesson 264, idea of the day"],["Father, You stand before me and behind, beside me, in the place I see myself, and everywhere I go, You are in all the things I look upon, the sounds I hear, and every hand that reaches for my own.","Lesson 264, paragraph 1, sentence 1"],["The images I see reflect my thoughts.","Lesson 265, paragraph 1, sentence 8"],["In quiet would I look upon the world, which but reflects Your Thoughts, and mine as well.","Lesson 265, paragraph 2, sentence 1"],["My holy Self abides in you, God’s Son.","Lesson 266, idea of the day"],["My heart is beating in the peace of God.","Lesson 267, idea of the day"],["Peace fills my heart, and floods my body with the purpose of forgiveness.","Lesson 267, paragraph 1, sentence 3"],["Each heartbeat brings me peace; each breath infuses me with strength.","Lesson 267, paragraph 1, sentence 5"],["Father, my heart is beating in the peace the Heart of Love created.","Lesson 267, paragraph 2, sentence 2"],["In Love was I created, and in Love will I remain forever.","Lesson 268, paragraph 1, sentence 5"],["Only reality is free of pain.","Lesson 268, paragraph 2, sentence 2"],["Only reality is free of pain. Only reality is free of loss.","Lesson 268, paragraph 2, sentences 2-3"],["Only reality is free of loss.","Lesson 268, paragraph 2, sentence 3"],["My sight goes forth to look upon Christ’s face.","Lesson 269, idea of the day"],["I ask for the illusion which transcends all those I made.","Lesson 269, paragraph 1, sentence 4"],["We share one vision, as we look upon the face of Him Whose Self is ours.","Lesson 269, paragraph 2, sentence 2"],["We are one because of Him Who is the Son of God; of Him Who is our own Identity.","Lesson 269, paragraph 2, sentence 3"],["I will not use the body’s eyes today.","Lesson 270, idea of the day"],["A light has entered the darkness.","Manual for Teachers, question 1, introduction, paragraph 1, sentence 4"],["The ego’s voice is an hallucination.","Chapter 8, section I, paragraph 2, sentence 2"],["Every response to the ego is a call to war, and war does deprive you of peace.","Chapter 8, section I, paragraph 3, sentence 1"],["As a teacher, then, the ego is totally confused and totally confusing.","Chapter 8, section II, paragraph 1, sentence 8"],["The Holy Spirit opposes any imprisoning of the will of a Son of God, knowing that the will of the Son is the Father’s.","Chapter 8, section II, paragraph 4, sentence 3"],["Only His teaching will release your will to God’s, uniting it with His power and glory and establishing them as yours.","Chapter 8, section III, paragraph 2, sentence 6"],["The Father must give fatherhood to His Son, because His Own Fatherhood must be extended outward.","Chapter 8, section III, paragraph 3, sentence 4"],["Whenever you are with a brother, you are learning what you are because you are teaching what you are.","Chapter 8, section III, paragraph 5, sentence 8"],["The Holy Spirit teaches that all strength is in God and therefore in you.","Chapter 8, section III, paragraph 7, sentence 4"],["The Holy Spirit teaches that all strength is in God and therefore in you. God wills no one suffer.","Chapter 8, section III, paragraph 7, sentences 4-5"],["Power and glory belong to God alone.","Chapter 8, section III, paragraph 8, sentence 1"],["You cannot maintain the illusion of loneliness if you are not alone.","Chapter 8, section IV, paragraph 2, sentence 7"],["The light becomes ours, and you cannot abide in darkness any more than darkness can abide wherever you go.","Chapter 8, section IV, paragraph 2, sentence 12"],["You were in darkness until God’s Will was done completely by any part of the Sonship.","Chapter 8, section IV, paragraph 3, sentence 1"],["Healing does not come from anyone else.","Chapter 8, section IV, paragraph 4, sentence 5"],["Healing is the way in which the separation is overcome.","Chapter 8, section IV, paragraph 5, sentence 3"],["Healing is the way in which the separation is overcome. Separation is overcome by union.","Chapter 8, section IV, paragraph 5, sentences 3-4"],["Your mind is the means by which you determine your own condition, because mind is the mechanism of decision.","Chapter 8, section IV, paragraph 5, sentence 7"],["God’s Sons are equal in will, all being the Will of their Father.","Chapter 8, section IV, paragraph 6, sentence 8"],["In our remembrance of each other lies our remembrance of God.","Chapter 8, section IV, paragraph 7, sentence 6"],["By offering freedom you will be free.","Chapter 8, section IV, paragraph 7, sentence 11"],["Your identification is with the Father and with the Son.","Chapter 8, section IV, paragraph 8, sentence 6"],["By not being separate, the Mind of God is established in ours and as ours.","Chapter 8, section V, paragraph 1, sentence 7"],["You will realise this when you understand that there is no separation between your will and mine.","Chapter 8, section V, paragraph 2, sentence 9"],["By joining your mind with mine you are signifying your awareness that the Will of God is one.","Chapter 8, section V, paragraph 2, sentence 12"],["Our union is therefore the way to renounce the ego in you.","Chapter 8, section V, paragraph 4, sentence 2"],["Our union is therefore the way to renounce the ego in you. The truth in both of us is beyond the ego.","Chapter 8, section V, paragraph 4, sentences 2-3"],["The truth in both of us is beyond the ego.","Chapter 8, section V, paragraph 4, sentence 3"],["Nothing can prevail against our united wills because nothing can prevail against God’s.","Chapter 8, section V, paragraph 4, sentence 6"],["Ours is simply the journey back to God Who is our home.","Chapter 8, section V, paragraph 5, sentence 4"],["We begin the journey back by setting out together, and gather in our brothers as we continue together.","Chapter 8, section VI, paragraph 1, sentence 2"],["You cannot behold the world and know God.","Chapter 8, section VI, paragraph 2, sentence 2"],["God wants only His Son because His Son is His only treasure.","Chapter 8, section VI, paragraph 5, sentence 1"],["Your creations are your gift to the Holy Trinity, created in gratitude for your creation.","Chapter 8, section VI, paragraph 5, sentence 3"],["Your creations love you as you love your Father for the gift of creation.","Chapter 8, section VI, paragraph 5, sentence 7"],["Your function is to add to God’s treasure by creating yours.","Chapter 8, section VI, paragraph 6, sentence 1"],["Creation is the Will of God.","Chapter 8, section VI, paragraph 6, sentence 8"],["The whole power of God’s Son lies in all of us, but not in any of us alone.","Chapter 8, section VI, paragraph 8, sentence 5"],["Through our creations we extend our love, and thus increase the joy of the Holy Trinity.","Chapter 8, section VI, paragraph 8, sentence 9"],["The journey to God is merely the reawakening of the knowledge of where you are always, and what you are forever.","Chapter 8, section VI, paragraph 9, sentence 6"],["You are accepting it simply by the belief that attack can get you something you want.","Chapter 8, section VII, paragraph 1, sentence 4"],["Communication ends separation.","Chapter 8, section VII, paragraph 4, sentence 1"],["Healing is the result of using the body solely for communication.","Chapter 8, section VII, paragraph 10, sentence 1"],["Perception of the body can be unified only by one purpose.","Chapter 8, section VII, paragraph 12, sentence 3"],["You are not limited by the body, and thought cannot be made flesh.","Chapter 8, section VII, paragraph 14, sentence 1"],["Joy is unified purpose, and unified purpose is only God’s.","Chapter 8, section VII, paragraph 15, sentence 1"],["Attitudes toward the body are attitudes toward attack.","Chapter 8, section VIII, paragraph 1, sentence 1"],["To the ego the body is to attack with .","Chapter 8, section VIII, paragraph 1, sentence 5"],["In perception the whole is built up of parts that can separate and reassemble in different constellations.","Chapter 8, section VIII, paragraph 1, sentence 12"],["If you had, you would not consider sickness such a strong witness on behalf of the ego’s views.","Chapter 8, section VIII, paragraph 4, sentence 3"],["The ego as a judge gives anything but an impartial judgement.","Chapter 8, section VIII, paragraph 4, sentence 8"],["The function of truth is to collect information that is true.","Chapter 8, section VIII, paragraph 6, sentence 7"],["There are many instances of how what you want distorts perception.","Chapter 8, section VIII, paragraph 8, sentence 3"],["No one can doubt the ego’s skill in building up false cases.","Chapter 8, section VIII, paragraph 8, sentence 4"],["Nor can anyone doubt your willingness to listen until you choose not to accept anything except truth.","Chapter 8, section VIII, paragraph 8, sentence 5"],["The Holy Spirit’s Voice is as loud as your willingness to listen.","Chapter 8, section VIII, paragraph 8, sentence 7"],["Health is the result of relinquishing all attempts to use the body lovelessly.","Chapter 8, section VIII, paragraph 9, sentence 9"],["Only perception can be sick, because only perception can be wrong.","Chapter 8, section IX, paragraph 1, sentence 7"],["Whenever you wake dispiritedly, it was not given to the Holy Spirit.","Chapter 8, section IX, paragraph 4, sentence 4"],["Sleep is no more a form of death than death is a form of unconsciousness.","Chapter 8, section IX, paragraph 4, sentence 7"],["You can rest in peace only because you are awake.","Chapter 8, section IX, paragraph 4, sentence 9"],["Healing is release from the fear of waking and the substitution of the decision to wake.","Chapter 8, section IX, paragraph 5, sentence 1"],["The decision to wake is the reflection of the will to love, since all healing involves replacing fear with love.","Chapter 8, section IX, paragraph 5, sentence 2"],["The real world shows a world seen differently, through quiet eyes and with a mind at peace.","Workbook Part II, section 8, paragraph 2, sentence 2"],["The real world signifies the end of time, for its perception makes time purposeless.","Workbook Part II, section 8, paragraph 4, sentence 3"],["Christ’s vision looks through me today.","Lesson 291, paragraph 1, sentence 1"],["Father, guide Your Son along the quiet path that leads to You.","Lesson 291, paragraph 2, sentence 5"],["God’s promises make no exceptions.","Lesson 292, paragraph 1, sentence 1"],["All fear is past and only love is here.","Lesson 293, idea of the day"],["Father, let not Your holy world escape my sight today.","Lesson 293, paragraph 2, sentence 1"],["And I would see only this world before my eyes today.","Lesson 293, paragraph 2, sentence 4"],["My body is a wholly neutral thing.","Lesson 294, idea of the day"],["My body, Father, cannot be Your Son.","Lesson 294, paragraph 2, sentence 1"],["The Holy Spirit looks through me today.","Lesson 295, idea of the day"],["Christ asks that He may use my eyes today, and thus redeem the world.","Lesson 295, paragraph 1, sentence 1"],["As I am saved, the world is saved with me.","Lesson 295, paragraph 1, sentence 5"],["Fear appears in many different forms, but love is one.","Lesson 295, paragraph 1, sentence 7"],["The Holy Spirit speaks through me today.","Lesson 296, idea of the day"],["The Holy Spirit needs my voice today, that all the world may listen to Your Voice, and hear Your Word through me.","Lesson 296, paragraph 1, sentence 1"],["I would be saviour to the world I made.","Lesson 296, paragraph 1, sentence 3"],["Forgiveness is the only gift I give.","Lesson 297, idea of the day"],["I love You, Father, and I love Your Son.","Lesson 298, idea of the day"],["My gratitude permits my love to be accepted without fear.","Lesson 298, paragraph 1, sentence 1"],["All that intruded on my holy sight forgiveness takes away.","Lesson 298, paragraph 1, sentence 3"],["Father, I come to You today, because I would not follow any way but Yours.","Lesson 298, paragraph 2, sentence 1"],["Eternal holiness abides in me.","Lesson 299, idea of the day"],["My holiness is far beyond my own ability to understand or know.","Lesson 299, paragraph 1, sentence 1"],["Father, my holiness is not of me.","Lesson 299, paragraph 2, sentence 1"],["In this world, however, forgiveness depends on justice, since all attack can only be unjust.","Manual for Teachers, question 19, introduction, paragraph 1, sentence 5"],["Justice is the Holy Spirit’s verdict upon the world.","Manual for Teachers, question 19, introduction, paragraph 1, sentence 6"],["The thought of separation would have been forever inconceivable.","Manual for Teachers, question 19, introduction, paragraph 1, sentence 9"],["Salvation is God’s justice.","Manual for Teachers, question 19, introduction, paragraph 4, sentence 1"],["God’s Judgement is His justice.","Manual for Teachers, question 19, introduction, paragraph 4, sentence 6"],["Perception can make whatever picture the mind desires to see.","Manual for Teachers, question 19, introduction, paragraph 5, sentence 2"],["Perception rests, the mind is still, and light returns again.","Manual for Teachers, question 19, introduction, paragraph 5, sentence 9"],["Perception rests, the mind is still, and light returns again. Vision is now restored.","Manual for Teachers, question 19, introduction, paragraph 5, sentences 9-10"],["The peace of God descends on all the world, and we can see.","Manual for Teachers, question 19, introduction, paragraph 5, sentence 12"],["The proper set, adopted consciously each time you wake, will put you well ahead.","Chapter 30, section I, paragraph 1, sentence 5"],["God asks you do your will.","Chapter 30, section II, paragraph 1, sentence 5"],["There is nothing else that ever should be called by freedom’s name.","Chapter 30, section II, paragraph 2, sentence 3"],["There is nothing else that ever should be called by freedom’s name. Unless you do your will you are not free.","Chapter 30, section II, paragraph 2, sentences 3-4"],["Unless you do your will you are not free.","Chapter 30, section II, paragraph 2, sentence 4"],["God knows not form.","Chapter 30, section III, paragraph 4, sentence 5"],["Creation gives no separate person and no separate thing the power to complete the Son of God.","Chapter 30, section III, paragraph 4, sentence 9"],["Completion is the function of God’s Son.","Chapter 30, section III, paragraph 5, sentence 1"],["Nothing that God knows not exists.","Chapter 30, section III, paragraph 6, sentence 1"],["Thoughts are not born and cannot die.","Chapter 30, section III, paragraph 6, sentence 5"],["The thoughts you think are in your mind, as you are in the Mind Which thought of you.","Chapter 30, section III, paragraph 6, sentence 7"],["The Thought God holds of you is perfectly unchanged by your forgetting.","Chapter 30, section III, paragraph 7, sentence 6"],["The Thoughts of God are far beyond all change, and shine forever.","Chapter 30, section III, paragraph 8, sentence 1"],["Beyond all idols is the Thought God holds of you.","Chapter 30, section III, paragraph 10, sentence 1"],["The truth could never be attacked.","Chapter 30, section IV, paragraph 1, sentence 4"],["You attack but false ideas, and never truthful ones.","Chapter 30, section IV, paragraph 1, sentence 7"],["Reality observes the laws of God, and not the rules you set.","Chapter 30, section IV, paragraph 4, sentence 1"],["All illusions that you believe about yourself obey no laws.","Chapter 30, section IV, paragraph 4, sentence 3"],["God’s Son needs no defence against his dreams.","Chapter 30, section IV, paragraph 5, sentence 12"],["Appearances can but deceive the mind that wants to be deceived.","Chapter 30, section IV, paragraph 6, sentence 1"],["The real world is the state of mind in which the only purpose of the world is seen to be forgiveness.","Chapter 30, section V, paragraph 1, sentence 1"],["Fear is not its goal, for the escape from guilt becomes its aim.","Chapter 30, section V, paragraph 1, sentence 2"],["The Will of God forever lies in those whose hands are joined.","Chapter 30, section V, paragraph 11, sentence 1"],["Salvation does not lie in being asked to make unnatural responses which are inappropriate to what is real.","Chapter 30, section VI, paragraph 2, sentence 4"],["Forgiveness is the only sane response.","Chapter 30, section VI, paragraph 2, sentence 8"],["If one appearance must remain apart from healing, one illusion must be part of truth.","Chapter 30, section VI, paragraph 7, sentence 3"],["You must forgive God’s Son entirely.","Chapter 30, section VI, paragraph 7, sentence 5"],["The Holy Spirit looks upon the world as with one purpose, changelessly established.","Chapter 30, section VII, paragraph 1, sentence 4"],["Fear is a judgement never justified.","Chapter 30, section VII, paragraph 3, sentence 8"],["You do not have to judge, for you have learned one meaning has been given everything, and you are glad to see it everywhere.","Chapter 30, section VII, paragraph 4, sentence 3"],["The Holy Spirit’s goal gives one interpretation, meaningful to you and to your brother.","Chapter 30, section VII, paragraph 6, sentence 2"],["In any thought of loss there is no meaning.","Chapter 30, section VII, paragraph 6, sentence 10"],["Your dark dreams are but the senseless, isolated scripts you write in sleep.","Chapter 30, section VII, paragraph 6, sentence 15"],["Only dreams of pardon can be shared.","Chapter 30, section VII, paragraph 6, sentence 17"],["Miracles but show what you have interposed between reality and your awareness is unreal, and does not interfere at all.","Chapter 30, section VIII, paragraph 4, sentence 2"],["HEALING?","Manual for Teachers, question 21, introduction, paragraph 1, sentence 1"],["But this refers to the prayer of the heart, not to the words you use in praying.","Manual for Teachers, question 21, introduction, paragraph 2, sentence 4"],["As symbols, words have quite specific references.","Manual for Teachers, question 21, introduction, paragraph 3, sentence 1"],["The body's cause is unforgiveness of the Son of God.","The Song of Prayer, part 3, section I, paragraph 2, sentence 1"],["The body can be healed as an effect of true forgiveness.","The Song of Prayer, part 3, section I, paragraph 3, sentence 1"],["Only false healing can give way to fear, so sickness will be free to strike again.","The Song of Prayer, part 3, section II, paragraph 1, sentence 3"],["False healing can indeed remove a form of pain and sickness.","The Song of Prayer, part 3, section II, paragraph 1, sentence 4"],["The cause is still the wish to die and o vercome the Christ.","The Song of Prayer, part 3, section II, paragraph 1, sentence 6"],["Death is reward and not a punishment.","The Song of Prayer, part 3, section II, paragraph 5, sentence 5"],["If you are healed your healing is complete.","The Song of Prayer, part 3, section II, paragraph 5, sentence 10"],["If you are healed your healing is complete. Forgiveness is the only gift you give and would receive.","The Song of Prayer, part 3, section II, paragraph 5, sentences 10-11"],["Forgiveness is the only gift you give and would receive.","The Song of Prayer, part 3, section II, paragraph 5, sentence 11"],["False healing heals the body in a part, but never as a whole.","The Song of Prayer, part 3, section III, paragraph 1, sentence 1"],["Healing - to - separate may seem to be a strange idea.","The Song of Prayer, part 3, section III, paragraph 2, sentence 1"],["The healing of the body can be done by this because, in dreams, equality cannot be permanent.","The Song of Prayer, part 3, section III, paragraph 2, sentence 6"],["You do not make yourself the bearer of the special gift that brings the healing.","The Song of Prayer, part 3, section III, paragraph 4, sentence 5"],["Sickness and separation must be healed by love and union.","The Song of Prayer, part 3, section III, paragraph 5, sentence 7"],["Sickness and separation must be healed by love and union. Nothing else can heal as God established healing.","The Song of Prayer, part 3, section III, paragraph 5, sentences 7-8"],["Nothing else can heal as God established healing.","The Song of Prayer, part 3, section III, paragraph 5, sentence 8"],["God's Voice alone can tell you how to heal.","The Song of Prayer, part 3, section III, paragraph 6, sentence 1"],["You have learned your need of healing.","Chapter 11, section I, paragraph 1, sentence 1"],["If you were not part of God, His Will would not be unified.","Chapter 11, section I, paragraph 3, sentence 1"],["There is no end to God and His Son, for we are the universe.","Chapter 11, section I, paragraph 5, sentence 5"],["God has given you a place in His Mind that is yours forever.","Chapter 11, section I, paragraph 6, sentence 1"],["Your fatherhood and your Father are one.","Chapter 11, section I, paragraph 7, sentence 6"],["Every attack is a step away from this, and every healing thought brings it closer.","Chapter 11, section II, paragraph 1, sentence 2"],["Every miracle that you accomplish speaks to you of the Fatherhood of God.","Chapter 11, section II, paragraph 2, sentence 4"],["Every healing thought that you accept, either from your brother or in your own mind, teaches you that you are God’s Son.","Chapter 11, section II, paragraph 2, sentence 5"],["In every hurtful thought you hold, wherever you perceive it, lies the denial of God’s Fatherhood and of your Sonship.","Chapter 11, section II, paragraph 2, sentence 6"],["Healing is a sign that you want to make whole.","Chapter 11, section II, paragraph 4, sentence 1"],["Whenever you ask the ego to enter, you lessen His welcome.","Chapter 11, section II, paragraph 5, sentence 5"],["Real freedom depends on welcoming reality, and of your guests only the Holy Spirit is real.","Chapter 11, section II, paragraph 7, sentence 7"],["Yours is the way of pain, of which God knows nothing.","Chapter 11, section III, paragraph 4, sentence 2"],["Fear and grief are your guests, and they go with you and abide with you on the way.","Chapter 11, section III, paragraph 4, sentence 4"],["The Great Light always surrounds you and shines out from you.","Chapter 11, section III, paragraph 4, sentence 7"],["You will never lose your way, for God leads you.","Chapter 11, section III, paragraph 5, sentence 3"],["Only God’s Comforter can comfort you.","Chapter 11, section III, paragraph 7, sentence 1"],["You cannot enter God’s Presence with the dark companions beside you, but you also cannot enter alone.","Chapter 11, section III, paragraph 7, sentence 8"],["All your brothers must enter with you, for until you have accepted them you cannot enter.","Chapter 11, section III, paragraph 7, sentence 9"],["But be holy in the Presence of God, or you will not know that you are there. For what is unlike God cannot enter His Mind, because it was not His Thought and therefore does not belong to Him.","Chapter 11, section III, paragraph 7, sentences 4-5"],["For what is unlike God cannot enter His Mind, because it was not His Thought and therefore does not belong to Him.","Chapter 11, section III, paragraph 7, sentence 5"],["Glory is your inheritance, given you by your Creator that you might extend it.","Chapter 11, section IV, paragraph 1, sentence 5"],["You would not do so if you realised that you can darken only your own mind.","Chapter 11, section IV, paragraph 3, sentence 5"],["You cannot enter God’s Presence if you attack His Son .","Chapter 11, section IV, paragraph 5, sentence 6"],["Christ is at God’s altar, waiting to welcome His Son.","Chapter 11, section IV, paragraph 6, sentence 1"],["You can refuse to enter, but you cannot bar the door that Christ holds open.","Chapter 11, section IV, paragraph 6, sentence 5"],["Peace be unto you who rest in God, and in whom the whole Sonship rests.","Chapter 11, section IV, paragraph 8, sentence 4"],["Clarity undoes confusion by definition, and to look upon darkness through light must dispel it.","Chapter 11, section V, paragraph 2, sentence 9"],["The ego analyses; the Holy Spirit accepts.","Chapter 11, section V, paragraph 14, sentence 1"],["Perceptions are built up on the basis of experience, and experience leads to beliefs.","Chapter 11, section VI, paragraph 1, sentence 2"],["The resurrection is the complete triumph of Christ over the ego, not by attack but by transcendence.","Chapter 11, section VI, paragraph 1, sentence 6"],["You will not find peace until you have removed the nails from the hands of God’s Son, and taken the last thorn from his forehead.","Chapter 11, section VI, paragraph 7, sentence 1"],["The dream of crucifixion still lies heavy on your eyes, but what you see in dreams is not reality.","Chapter 11, section VI, paragraph 8, sentence 4"],["God created only the eternal, and everything you see is perishable.","Chapter 11, section VII, paragraph 1, sentence 2"],["Every loving thought that the Son of God ever had is eternal.","Chapter 11, section VII, paragraph 2, sentence 1"],["If you believe in truth and illusion, you cannot tell which is true.","Chapter 11, section VII, paragraph 3, sentence 6"],["You can know God because it is His Will to be known.","Chapter 11, section VII, paragraph 4, sentence 8"],["The reinterpretation of the world is the transfer of all perception to knowledge.","Chapter 11, section VIII, paragraph 1, sentence 9"],["Instruction in perception is your great need, for you understand nothing.","Chapter 11, section VIII, paragraph 3, sentence 5"],["Perceptions are learned, and you are not without a Teacher.","Chapter 11, section VIII, paragraph 3, sentence 7"],["Every situation, properly perceived, becomes an opportunity to heal the Son of God.","Chapter 19, section I, paragraph 2, sentence 1"],["Truth is the absence of illusion; illusion the absence of truth.","Chapter 1 Corrected error is the error’s end.","Chapter 25, section III, paragraph 4, sentence 2"],["Nothing arises but is met with instant and complete forgiveness.","Chapter 25, section III, paragraph 5, sentence 3"],["Sin is the fixed belief perception cannot change.","Chapter 25, section III, paragraph 8, sentence 4"],["Sin is attacked by punishment, and so preserved.","Chapter 25, section III, paragraph 8, sentence 12"],["In you is all of Heaven.","Chapter 25, section IV, paragraph 5, sentence 1"],["In you is all of Heaven. Every leaf that falls is given life in you.","Chapter 25, section IV, paragraph 5, sentences 1-2"],["Every leaf that falls is given life in you.","Chapter 25, section IV, paragraph 5, sentence 2"],["Christ stands before you, each time you look upon your brother.","Chapter 25, section V, paragraph 2, sentence 9"],["Forgiven by you, your saviour offers you salvation.","Chapter 25, section V, paragraph 4, sentence 5"],["In your brother you see the picture of your own belief in what the Will of God must be for you.","Chapter 25, section V, paragraph 6, sentence 3"],["God is glad to have you look on him.","Chapter 25, section VI, paragraph 3, sentence 3"],["Forgiveness is the only function meaningful in time.","Chapter 25, section VI, paragraph 5, sentence 3"],["Salvation is no more than a reminder this world is not your home.","Chapter 25, section VI, paragraph 6, sentence 1"],["All that you made can serve salvation easily and well.","Chapter 25, section VI, paragraph 7, sentence 4"],["Sin is the only thing in all the world that cannot change.","Chapter 25, section VII, paragraph 1, sentence 2"],["The magic of the world can seem to hide the pain of sin from sinners, and deceive with glitter and with guile.","Chapter 25, section VII, paragraph 1, sentence 5"],["The world is safe from love to everyone who thinks sin possible.","Chapter 25, section VII, paragraph 1, sentence 9"],["If one belief so deeply valued here were true, then every Thought God ever had is an illusion.","Chapter 25, section VII, paragraph 3, sentence 7"],["The rest is up to God, and not to you.","Chapter 25, section VII, paragraph 3, sentence 12"],["Sin is not real because the Father and the Son are not insane.","Chapter 25, section VII, paragraph 4, sentence 8"],["And one in which nothing is contradicted that would lead the Son of God to sanity and joy.","Chapter 25, section VII, paragraph 5, sentence 2"],["Nothing attests to death and cruelty; to separation and to differences.","Chapter 25, section VII, paragraph 5, sentence 3"],["The whole belief that someone loses but reflects the underlying tenet God must be insane.","Chapter 25, section VII, paragraph 11, sentence 1"],["For every little gain must someone lose, and pay exact amount in blood and suffering.","Chapter 25, section VII, paragraph 11, sentence 5"],["Salvation is rebirth of the idea no one can lose for anyone to gain.","Chapter 25, section VII, paragraph 12, sentence 1"],["Death demands life, but life is not maintained at any cost.","Chapter 25, section VII, paragraph 13, sentence 2"],["No one can suffer for the Will of God to be fulfilled.","Chapter 25, section VII, paragraph 13, sentence 3"],["The laws of sin demand a victim.","Chapter 25, section VIII, paragraph 3, sentence 3"],["Justice demands no sacrifice, for any sacrifice is made that sin may be preserved and kept.","Chapter 25, section VIII, paragraph 4, sentence 5"],["Without love is justice prejudiced and weak.","Chapter 25, section VIII, paragraph 11, sentence 7"],["In justice, then, does love correct mistakes, but not in vengeance.","Chapter 25, section VIII, paragraph 11, sentence 11"],["God’s Son has found a witness unto his sinlessness and not his sins.","Chapter 25, section VIII, paragraph 12, sentence 8"],["God’s justice warrants gratitude, not fear.","Chapter 25, section IX, paragraph 2, sentence 3"],["Each gift but adds to the supply.","Chapter 25, section IX, paragraph 2, sentence 6"],["The sight of innocence makes punishment impossible, and justice sure.","Chapter 25, section IX, paragraph 4, sentence 1"],["The Holy Spirit’s perception leaves no ground for an attack.","Chapter 25, section IX, paragraph 4, sentence 2"],["A miracle can never be received because another could receive it not.","Chapter 25, section IX, paragraph 8, sentence 4"],["A miracle can never be received because another could receive it not. Only forgiveness offers miracles.","Chapter 25, section IX, paragraph 8, sentences 4-5"],["The unforgiven have no mercy to bestow upon another.","Chapter 25, section IX, paragraph 9, sentence 5"],["The miracle that you receive, you give.","Chapter 25, section IX, paragraph 10, sentence 1"],["All the effects of guilt are here no more.","Chapter 28, section I, paragraph 2, sentence 1"],["Memory, like perception, is a skill made up by you to take the place of what God gave in your creation.","Chapter 28, section I, paragraph 2, sentence 7"],["Time neither takes away nor can restore.","Chapter 28, section I, paragraph 6, sentence 3"],["The miracle reminds you of a Cause forever present, perfectly untouched by time and interference.","Chapter 28, section I, paragraph 9, sentence 4"],["And so your innocence has not been lost.","Chapter 28, section I, paragraph 10, sentence 7"],["And so your innocence has not been lost. You need no healing to be healed.","Chapter 28, section I, paragraph 10, sentences 7-8"],["You need no healing to be healed.","Chapter 28, section I, paragraph 10, sentence 8"],["The miracle comes quietly into the mind that stops an instant and is still.","Chapter 28, section I, paragraph 11, sentence 1"],["The cause a cause is made by its effects; the Father is a Father by His Son.","Chapter 28, section II, paragraph 1, sentence 2"],["The cause of healing is the only Cause of everything.","Chapter 28, section II, paragraph 3, sentence 3"],["An empty storehouse, with an open door, holds all your shreds of memories and dreams.","Chapter 28, section II, paragraph 5, sentence 1"],["In dreams of murder and attack are you the victim in a dying body slain.","Chapter 28, section II, paragraph 5, sentence 5"],["The miracle is the first step in giving back to cause the function of causation, not effect.","Chapter 28, section II, paragraph 9, sentence 3"],["The miracle returns the cause of fear. to you who made it.","Chapter 28, section II, paragraph 11, sentence 1"],["The miracle alone is your concern at present.","Chapter 28, section III, paragraph 1, sentence 3"],["Without support, the dream will fade away without effects.","Chapter 28, section III, paragraph 1, sentence 7"],["Healing is the effect of minds that join, as sickness comes from minds that separate.","Chapter 28, section III, paragraph 2, sentence 6"],["The miracle does nothing just because the minds are joined, and cannot separate.","Chapter 28, section III, paragraph 3, sentence 1"],["The end of dreaming is the end of fear, and love was never in the world of dreams.","Chapter 28, section III, paragraph 4, sentence 1"],["The cause of pain is separation, not the body, which is only its effect.","Chapter 28, section III, paragraph 5, sentence 1"],["God builds the bridge, but only in the space left clean and vacant by the miracle.","Chapter 28, section III, paragraph 6, sentence 1"],["The dream of healing in forgiveness lies, and gently shows you that you never sinned.","Chapter 28, section III, paragraph 8, sentence 4"],["The miracle would leave no proof of guilt to bring you witness to what never was.","Chapter 28, section III, paragraph 8, sentence 5"],["You could be anyone or anything, depending on whose evil dream you share.","Chapter 28, section IV, paragraph 1, sentence 9"],["You can be sure of just one thing; that you are evil, for you share in dreams of fear.","Chapter 28, section IV, paragraph 1, sentence 10"],["The dream is but illusion in the mind. And with the mind you would unite, but never with the dream.","Chapter 28, section IV, paragraph 2, sentences 6-7"],["And with the mind you would unite, but never with the dream.","Chapter 28, section IV, paragraph 2, sentence 7"],["Your dreams are witnesses to his, and his attest the truth of yours.","Chapter 28, section IV, paragraph 6, sentence 5"],["The Holy Spirit’s function is to take the broken picture of the Son of God and put the pieces into place again.","Chapter 28, section IV, paragraph 8, sentence 1"],["The seeds of sickness come from the belief that there is joy in separation, and its giving up would be a sacrifice.","Chapter 28, section IV, paragraph 10, sentence 6"],["Your willingness to let illusions go is all the Healer of God’s Son requires.","Chapter 28, section IV, paragraph 10, sentence 8"],["God is the Alternate to dreams of fear.","Chapter 28, section V, paragraph 1, sentence 6"],["And you exist because God shared His Will with you, that His creation might create.","Chapter 28, section V, paragraph 1, sentence 11"],["Forgiveness separates the dreamer from the evil dream, and thus releases him.","Chapter 28, section V, paragraph 3, sentence 3"],["You are your Self or an illusion.","Chapter 28, section V, paragraph 3, sentence 9"],["A middle ground, where you can be a thing that is not you, must be a dream and cannot be the truth.","Chapter 28, section V, paragraph 3, sentence 11"],["The world you see does not exist, because the place where you perceive it is not real.","Chapter 28, section V, paragraph 7, sentence 2"],["The body represents the gap between the little bit of mind you call your own and all the rest of what is really yours.","Chapter 28, section VI, paragraph 4, sentence 1"],["God keeps His promises; His Son keeps his.","Chapter 28, section VI, paragraph 6, sentence 3"],["I see through strength, the gift of God to me.","Lesson 111, paragraph 2, sentence 2"],["For thus am I released from them with all the world.","Lesson 115, paragraph 1, sentence 2"],["I am essential to the plan of God for the salvation of the world.","Lesson 115, paragraph 2, sentence 2"],["I share my Father’s Will for me, His Son.","Lesson 116, paragraph 2, sentence 2"],["I would accept all that is mine in truth.","Lesson 117, paragraph 2, sentence 4"],["Each unforgiving mind presents you with an opportunity to teach your own how to forgive itself.","Lesson 121, paragraph 7, sentence 1"],["Everything we touch takes on a shining light that blesses and that heals.","Lesson 124, paragraph 1, sentence 4"],["In our experience the world is freed.","Lesson 124, paragraph 7, sentence 6"],["Your Father wills you hear His Word today.","Lesson 125, paragraph 1, sentence 2"],["We will not judge ourselves today, for what we are can not be judged.","Lesson 125, paragraph 3, sentence 2"],["We stand apart from all the judgements which the world has laid upon the Son of God.","Lesson 125, paragraph 3, sentence 3"],["You would understand the means by which salvation comes to you, and would not hesitate to use it now.","Lesson 126, paragraph 1, sentence 3"],["The sin that you forgive is not your own.","Lesson 126, paragraph 4, sentence 3"],["Love’s meaning is obscure to anyone who thinks that love can change.","Lesson 127, paragraph 2, sentence 1"],["No law the world obeys can help you grasp love’s meaning.","Lesson 127, paragraph 5, sentence 1"],["The world that seems to hold you prisoner can be escaped by anyone who does not hold it dear.","Lesson 127, paragraph 8, sentence 3"],["The world you see holds nothing that you want.","Lesson 128, paragraph 2, sentence 5"],["Nothing here is worth one instant of delay and pain; one moment of uncertainty and doubt.","Lesson 128, paragraph 4, sentence 3"],["The world you see is merciless indeed, unstable, cruel, unconcerned with you, quick to avenge and pitiless with hate.","Lesson 129, paragraph 2, sentence 3"],["Truth is eclipsed by fear, and what remains is but imagined.","Lesson 130, paragraph 3, sentence 3"],["Fear has made everything you think you see.","Lesson 130, paragraph 4, sentence 1"],["All
