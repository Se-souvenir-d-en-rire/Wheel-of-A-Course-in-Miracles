","Chapter 23, section IV, paragraph 5, sentence 8"],["The Atonement principle was given to the Holy Spirit long before Jesus set it in motion.","Clarification of Terms, section 6, paragraph 2, sentence 4"],["The Holy Spirit is described as the remaining Communication Link between God and His separated Sons.","Clarification of Terms, section 6, paragraph 3, sentence 1"],["The Holy Spirit abides in the part of your mind that is part of the Christ Mind.","Clarification of Terms, section 6, paragraph 4, sentence 1"],["You can no longer say that you perceive no differences in false and true.","Chapter 31, section I, paragraph 1, sentence 8"],["God willed not His Son forget Him.","Chapter 31, section I, paragraph 6, sentence 2"],["And you will learn God’s Son is innocent, and see another world.","Chapter 31, section I, paragraph 7, sentence 11"],["God’s perfect Son remembers his creation.","Chapter 31, section I, paragraph 9, sentence 6"],["You do not understand Who calls to you beyond each form of hate; each call to war.","Chapter 31, section I, paragraph 10, sentence 4"],["You are deceived if you believe you want disaster and disunity and pain.","Chapter 31, section I, paragraph 11, sentence 3"],["You never hate your brother for his sins, but only for your own.","Chapter 31, section III, paragraph 1, sentence 5"],["If you are sin you are a body, for the mind acts not.","Chapter 31, section III, paragraph 3, sentence 7"],["Real choice is no illusion.","Chapter 31, section IV, paragraph 2, sentence 1"],["You did not come to learn to find a road the world does not contain.","Chapter 31, section IV, paragraph 6, sentence 3"],["The search for different pathways in the world is but the search for different forms of truth.","Chapter 31, section IV, paragraph 6, sentence 4"],["A concept of the self is made by you.","Chapter 31, section V, paragraph 2, sentence 1"],["The Holy Spirit does not seek to throw you into panic.","Chapter 31, section V, paragraph 11, sentence 5"],["You might, for instance, be the thing you chose to have your brother be.","Chapter 31, section V, paragraph 12, sentence 2"],["The concept of the self has always been the great preoccupation of the world.","Chapter 31, section V, paragraph 14, sentence 1"],["Salvation can be seen as nothing more than the escape from concepts.","Chapter 31, section V, paragraph 14, sentence 3"],["You will make many concepts of the self as learning goes along.","Chapter 31, section V, paragraph 16, sentence 1"],["The world can teach no images of you unless you want to learn them.","Chapter 31, section V, paragraph 17, sentence 1"],["There will come a time when images have all gone by, and you will see you know not what you are.","Chapter 31, section V, paragraph 17, sentence 2"],["You see the flesh or recognise the spirit.","Chapter 31, section VI, paragraph 1, sentence 1"],["If you choose flesh, you never will escape the body as your own reality, for you have chosen that you want it so.","Chapter 31, section VI, paragraph 1, sentence 7"],["Salvation does not ask that you behold the spirit and perceive the body not.","Chapter 31, section VI, paragraph 3, sentence 1"],["The means are given you by which to see the world that will replace the one you made.","Chapter 31, section VI, paragraph 4, sentence 2"],["The light is kept from everything you see.","Chapter 31, section VII, paragraph 7, sentence 3"],["Truth demonstrates illusions have no value.","Manual for Teachers, question 6, introduction, paragraph 1, sentence 3"],["God’s treasure house can never be empty.","Manual for Teachers, question 6, introduction, paragraph 4, sentence 8"],["You are free to perceive yourself as persecuted if you choose.","Chapter 6, section I, paragraph 5, sentence 2"],["We are still equal as learners, although we do not need to have equal experiences.","Chapter 6, section I, paragraph 10, sentence 1"],["That is because the Holy Spirit is one, and anyone who listens is inevitably led to demonstrate His way for all.","Chapter 6, section I, paragraph 10, sentence 6"],["No one is punished for sins, and the Sons of God are not sinners.","Chapter 6, section I, paragraph 16, sentence 4"],["You cannot love what you do not appreciate, for fear makes appreciation impossible.","Chapter 6, section I, paragraph 17, sentence 3"],["The separation is the notion of rejection.","Chapter 6, section I, paragraph 18, sentence 4"],["Projection and attack are inevitably related, because projection is always a means of justifying attack.","Chapter 6, section II, paragraph 3, sentence 5"],["Every ability of the ego has a better use, because its abilities are directed by the mind, which has a better Voice.","Chapter 6, section II, paragraph 4, sentence 2"],["The Holy Spirit begins by perceiving you as perfect.","Chapter 6, section II, paragraph 5, sentence 1"],["The perfect equality of the Holy Spirit’s perception is the reflection of the perfect equality of God’s knowing.","Chapter 6, section II, paragraph 7, sentence 1"],["The ego’s perception has no counterpart in God, but the Holy Spirit remains the bridge between perception and knowledge.","Chapter 6, section II, paragraph 7, sentence 2"],["By enabling you to use perception in a way that reflects knowledge, you will ultimately remember it.","Chapter 6, section II, paragraph 7, sentence 3"],["As we have already emphasised, every idea begins in the mind of the thinker.","Chapter 6, section III, paragraph 1, sentence 1"],["Your Godlike mind can never be defiled.","Chapter 6, section III, paragraph 1, sentence 6"],["Safety is the complete relinquishment of attack.","Chapter 6, section III, paragraph 3, sentence 7"],["Since you cannot not teach, your salvation lies in teaching the exact opposite of everything the ego believes.","Chapter 6, section III, paragraph 4, sentence 1"],["Unless you do believe it you will not side with it, and the ego feels badly in need of allies, though not of brothers.","Chapter 6, section IV, paragraph 4, sentence 4"],["You have chosen a sleep in which you have had bad dreams, but the sleep is not real and God calls you to awake.","Chapter 6, section IV, paragraph 6, sentence 3"],["Being alone lives in the Kingdom, where everything lives in God without question.","Chapter 6, section IV, paragraph 7, sentence 4"],["Your abilities are useless in the presence of God’s accomplishments, and also of yours.","Chapter 6, section IV, paragraph 8, sentence 2"],["You would be in an impossible situation if God showed you your perfection, and proved to you that you were wrong.","Chapter 6, section IV, paragraph 10, sentence 2"],["Fidelity to premises is a law of mind, and everything God created is faithful to His laws.","Chapter 6, section IV, paragraph 11, sentence 3"],["The separation was not a loss of perfection, but a failure in communication.","Chapter 6, section IV, paragraph 12, sentence 5"],["A harsh and strident form of communication arose as the ego’s voice.","Chapter 6, section IV, paragraph 12, sentence 6"],["God did not blot it out, because to eradicate it would be to attack it.","Chapter 6, section IV, paragraph 12, sentence 8"],["You had already taught yourself wrongly, having believed what was not true.","Chapter 6, section V, paragraph 1, sentence 2"],["You do not inform them that the nightmares that frightened them so badly are not real, because children believe in magic.","Chapter 6, section V, paragraph 2, sentence 2"],["The Holy Spirit makes no distinction among dreams.","Chapter 6, section V, paragraph 4, sentence 4"],["You did not believe in your own perfection.","Chapter 6, section V, paragraph 1, sentence 3"],["The world will end with the benediction of holiness upon it.","Manual for Teachers, question 14, introduction, paragraph 2, sentence 9"],["Healing is accomplished the instant the sufferer no longer sees any value in pain.","Manual for Teachers, question 5, section I, paragraph 1, sentence 1"],["Sickness is a method, conceived in madness, for placing God’s Son on his Father’s throne.","Manual for Teachers, question 5, section I, paragraph 1, sentence 7"],["Healing must occur in exact proportion to which the valuelessness of sickness is recognised.","Manual for Teachers, question 5, section II, paragraph 1, sentence 1"],["As God’s messengers, His teachers are the symbols of salvation.","Manual for Teachers, question 5, section III, paragraph 2, sentence 4"],["Therefore, to you it is important.","Chapter 21, introduction, paragraph 2, sentence 4"],["Therefore, seek not to change the world, but choose to change your mind about the world.","Chapter 21, introduction, paragraph 2, sentence 7"],["Judgement will always give you false directions, but vision shows you where to go.","Chapter 21, section I, paragraph 2, sentence 5"],["You could remember, yet you are afraid, believing you would lose the world you learned since then.","Chapter 21, section I, paragraph 7, sentence 3"],["The light expands and covers everything, extending to infinity forever shining and with no break or limit anywhere.","Chapter 21, section I, paragraph 8, sentence 4"],["The light in one awakens it in all.","Chapter 21, section I, paragraph 10, sentence 6"],["This seeming independence of effect enables it to be regarded as standing by itself, and capable of serving as a cause of the events and feelings its maker thinks it causes.","Chapter 21, section II, paragraph 11, sentence 3"],["All special relationships have sin as their goal.","Chapter 21, section III, paragraph 1, sentence 1"],["What faith you give to sin you take away from holiness.","Chapter 21, section III, paragraph 3, sentence 6"],["The Holy Spirit has a use for all the means for sin by which you sought to find it.","Chapter 21, section III, paragraph 6, sentence 1"],["The Holy Spirit sees perception as a means to teach you that the vision of the holy relationship is all you want to see.","Chapter 21, section III, paragraph 6, sentence 6"],["Faith and belief become attached to vision, as all the means that once served sin are redirected now toward holiness.","Chapter 21, section III, paragraph 7, sentence 1"],["Brother, the Holy Spirit knows that sacrifice brings nothing.","Chapter 21, section III, paragraph 9, sentence 2"],["You gave perception and belief and faith from mind to body.","Chapter 21, section III, paragraph 12, sentence 6"],["You are indeed afraid to look within and see the sin you think is there.","Chapter 21, section IV, paragraph 1, sentence 3"],["A holy relationship is one in which you join with what is part of you in truth.","Chapter 21, section IV, paragraph 3, sentence 5"],["The Holy Spirit’s purpose was accepted by the part of your mind the ego knows not of.","Chapter 21, section IV, paragraph 4, sentence 5"],["You have perceived the ego’s madness, and not been made afraid because you did not choose to share in it.","Chapter 21, section IV, paragraph 6, sentence 3"],["The ego’s weakness is its strength.","Chapter 21, section IV, paragraph 7, sentence 3"],["Perception selects, and makes the world you see.","Chapter 21, section V, paragraph 1, sentence 1"],["But on this choice depends far more than you may realise as yet.","Chapter 21, section V, paragraph 1, sentence 7"],["You do not realise the whole extent to which the idea of separation has interfered with reason.","Chapter 21, section V, paragraph 4, sentence 1"],["Reason lies in the other Self you have cut off from your awareness.","Chapter 21, section V, paragraph 4, sentence 2"],["God’s plan for your salvation could not have been established without your will and your consent.","Chapter 21, section V, paragraph 5, sentence 1"],["Your reason’s alien nature to the ego is proof you will not find the answer there.","Chapter 21, section V, paragraph 5, sentence 9"],["God’s plan is simple; never circular and never self-defeating.","Chapter 21, section V, paragraph 6, sentence 1"],["Reason is a means that serves the Holy Spirit’s purpose in its own right.","Chapter 21, section V, paragraph 7, sentence 10"],["Faith and perception and belief can be misplaced, and serve the great deceiver’s needs as well as truth.","Chapter 21, section V, paragraph 8, sentence 1"],["The part of mind where reason lies was dedicated, by your will in union with your Father’s, to the undoing of insanity.","Chapter 21, section V, paragraph 9, sentence 1"],["Reason is alien to insanity, and those who use it have gained a means which cannot be applied to sin.","Chapter 21, section V, paragraph 9, sentence 3"],["Faith and belief have shifted, and you have asked the question the ego will never ask.","Chapter 21, section V, paragraph 10, sentence 2"],["Faith and belief, upheld by reason, cannot fail to lead to changed perception.","Chapter 21, section V, paragraph 10, sentence 4"],["Reason will also tell you that when you think you sin, you call for help.","Chapter 21, section VI, paragraph 1, sentence 3"],["Correction cannot be accepted or refused by you without your brother.","Chapter 21, section VI, paragraph 2, sentence 1"],["Sin would maintain you and your brother must be separate.","Chapter 21, section VI, paragraph 2, sentence 6"],["If you choose sin instead of healing, you would condemn the Son of God to what can never be corrected.","Chapter 21, section VI, paragraph 6, sentence 1"],["Reason assures you Heaven is what you want, and all you want.","Chapter 21, section VI, paragraph 8, sentence 5"],["You are your brother’s saviour.","Chapter 21, section VI, paragraph 9, sentence 1"],["The Son of God is always blessed as one.","Chapter 21, section VI, paragraph 10, sentence 1"],["Your Father is as close to you as is your brother.","Chapter 21, section VI, paragraph 10, sentence 5"],["The power you have over the Son of God is not a threat to his reality.","Chapter 21, section VI, paragraph 11, sentence 1"],["No one believes the Son of God is powerless.","Chapter 21, section VII, paragraph 2, sentence 1"],["Until the last decision has been made, the answer is both “yes” and “no”.","Chapter 21, section VII, paragraph 13, sentence 3"],["The constancy of joy is a condition quite alien to your understanding.","Chapter 21, section VIII, paragraph 2, sentence 1"],["Your answer to the others has made it possible to help you be already partly sane.","Chapter 21, section VIII, paragraph 4, sentence 2"],["Miracles restore the mind to its fullness.","Chapter 1, section I, paragraph 24, sentence 2"],["Revelation induces complete but temporary suspension of doubt and fear.","Chapter 1, section II, paragraph 1, sentence 1"],["Revelation unites you directly with God. Miracles unite you directly with your brother.","Chapter 1, section II, paragraph 1, sentences 5-6"],["Miracles unite you directly with your brother.","Chapter 1, section II, paragraph 1, sentence 6"],["You are free to believe what you choose, and what you do attests to what you believe.","Chapter 1, section II, paragraph 1, sentence 9"],["You are a perfect creation, and should experience awe only in the presence of the Creator of perfection.","Chapter 1, section II, paragraph 3, sentence 3"],["The miracle is therefore a sign of love among equals.","Chapter 1, section II, paragraph 3, sentence 4"],["Equals should not be in awe of one another because awe implies inequality.","Chapter 1, section II, paragraph 3, sentence 5"],["An elder brother is entitled to respect for his greater experience, and obedience for his greater wisdom.","Chapter 1, section II, paragraph 3, sentence 7"],["The miracle minimises the need for time.","Chapter 1, section II, paragraph 6, sentence 1"],["The miracle substitutes for learning that might have taken thousands of years.","Chapter 1, section II, paragraph 6, sentence 7"],["The miracle shortens time by collapsing it, thus eliminating certain intervals within it.","Chapter 1, section II, paragraph 6, sentence 9"],["The power to work miracles belongs to you.","Chapter 1, section III, paragraph 1, sentence 7"],["You are the work of God, and His work is wholly loveable and wholly loving.","Chapter 1, section III, paragraph 2, sentence 3"],["Reality belongs only to spirit, and the miracle acknowledges only truth.","Chapter 1, section IV, paragraph 2, sentence 4"],["The miracle joins in the Atonement by placing the mind in the service of the Holy Spirit.","Chapter 1, section IV, paragraph 2, sentence 6"],["Your mind can be possessed by illusions, but spirit is eternally free.","Chapter 1, section IV, paragraph 2, sentence 8"],["Darkness is lack of light as sin is lack of love.","Chapter 1, section IV, paragraph 3, sentence 1"],["The purpose of the Atonement is to restore everything to you; or rather, to restore it to your awareness.","Chapter 1, section IV, paragraph 3, sentence 6"],["The emptiness engendered by fear must be replaced by forgiveness.","Chapter 1, section IV, paragraph 4, sentence 1"],["Time can waste as well as be wasted.","Chapter 1, section V, paragraph 2, sentence 2"],["The specialness of God’s Sons does not stem from exclusion but from inclusion.","Chapter 1, section V, paragraph 3, sentence 5"],["Ultimately, every member of the family of God must return.","Chapter 1, section V, paragraph 4, sentence 1"],["The creation is whole, and the mark of wholeness is holiness.","Chapter 1, section V, paragraph 4, sentence 5"],["Miracles are affirmations of Sonship, which is a state of completion and abundance.","Chapter 1, section V, paragraph 4, sentence 6"],["You act according to the particular order of needs you establish.","Chapter 1, section VI, paragraph 1, sentence 9"],["A sense of separation from God is the only lack you really need correct.","Chapter 1, section VI, paragraph 2, sentence 1"],["Ultimately, space is as meaningless as time.","Chapter 1, section VI, paragraph 3, sentence 5"],["The real purpose of this world is to use it to correct your unbelief.","Chapter 1, section VI, paragraph 4, sentence 1"],["But: Only perfect love exists.","Chapter 1, section VI, paragraph 5, sentence 5"],["All real pleasure comes from doing God’s Will.","Chapter 1, section VII, paragraph 1, sentence 4"],["Denial of Self results in illusions, while correction of the error brings release from it.","Chapter 1, section VII, paragraph 1, sentence 6"],["Fantasy is a distorted form of vision.","Chapter 1, section VII, paragraph 3, sentence 1"],["Fantasy is an attempt to control reality according to false needs.","Chapter 1, section VII, paragraph 3, sentence 4"],["You will also need them for preparation.","Chapter 1, section VII, paragraph 4, sentence 4"],["Healing is of God in the end.","Chapter 1, section VII, paragraph 5, sentence 9"],["Healing is of God in the end. The means are being carefully explained to you.","Chapter 1, section VII, paragraph 5, sentences 9-10"],["The means are being carefully explained to you.","Chapter 1, section VII, paragraph 5, sentence 10"],["The overall direction is one of progress toward the truth.","Psychotherapy, part 2, section I, paragraph 1, sentence 9"],["Th e changes the ego seeks to make are not really changes.","Psychotherapy, part 2, section I, paragraph 2, sentence 6"],["Illusions are illusions; truth is truth.","Psychotherapy, part 2, section I, paragraph 2, sentence 9"],["No one who learns to forgive can fail to remember God.","Psychotherapy, part 2, section II, paragraph 3, sentence 1"],["All blocks to the remembrance of God are forms of unforgiveness, and nothing else.","Psychotherapy, part 2, section II, paragraph 3, sentence 3"],["Belief implies that unbelief is possible, but knowledge of God has no true o pposite.","Psychotherapy, part 2, section II, paragraph 4, sentence 5"],["The process of psychotherapy is the return to sanity.","Psychotherapy, part 2, section II, paragraph 5, sentence 5"],["Perhaps the psychotherapist does not understand that healing comes from God.","Psychotherapy, part 2, section II, paragraph 7, sentence 5"],["No one who stands apart can recei ve Christ's vision.","Psychotherapy, part 2, section II, paragraph 9, sentence 2"],["Divided go als alone can interfere with perfect healing.","Psychotherapy, part 2, section III, paragraph 3, sentence 6"],["One wholly egoless therapist could heal the world without a word, merely by being there.","Psychotherapy, part 2, section III, paragraph 3, sentence 7"],["The id eal therapist is one with Christ.","Psychotherapy, part 2, section III, paragraph 4, sentence 1"],["Once God's Son is seen as guilty, illness becomes inevitable.","Psychotherapy, part 2, section IV, paragraph 2, sentence 1"],["Sickness and death and misery now stalk the earth in unrelenting waves, sometimes together and sometimes in grim succession.","Psychotherapy, part 2, section IV, paragraph 3, sentence 2"],["Healing is therapy or correction, and we have said already and will say again, all therapy is psychotherap y.","Psychotherapy, part 2, section IV, paragraph 3, sentence 6"],["Illness is therefore a mistake and needs correction.","Psychotherapy, part 2, section IV, paragraph 7, sentence 1"],["The truth is simple, being o ne for all.","Psychotherapy, part 2, section IV, paragraph 11, sentence 10"],["Nothing in the world is holier than helping one who asks for help.","Psychotherapy, part 2, section V, paragraph 4, sentence 2"],["A brother seeking aid can bring us gifts beyond the heights perceived in any dream.","Psychotherapy, part 2, section V, paragraph 5, sentence 1"],["The sacred calling of God's holy Son for help in his perceived distress can be but answered by his Father.","Psychotherapy, part 2, section V, paragraph 5, sentence 5"],["The limits laid on both the patient and the therapist will count as nothing, for the healing has begun.","Psychotherapy, part 2, section V, paragraph 6, sentence 3"],["Perhaps the answer doe s not seem to be a gift from Heaven.","Psychotherapy, part 2, section V, paragraph 6, sentence 8"],["In time no effort can be made in vain.","Psychotherapy, part 2, section V, paragraph 7, sentence 2"],["We are deceived already, if we think there is a need of healing.","Psychotherapy, part 2, section V, paragraph 7, sentence 4"],["The process of psychotherapy, then, can be defined simply as forgiveness, for no healing can be a nything else.","Psychotherapy, part 2, section VI, paragraph 1, sentence 1"],["Sickness takes many forms, and so does unforgiveness.","Psychotherapy, part 2, section VI, paragraph 5, sentence 1"],["Healing is here, and happiness and peace.","Psychotherapy, part 2, section VII, paragraph 2, sentence 8"],["Only Christ forgives, knowing His sinlessness.","Psychotherapy, part 2, section VII, paragraph 3, sentence 3"],["Guilt is impossible in those through whom the Holy Spirit spe aks.","Psychotherapy, part 2, section VII, paragraph 4, sentence 7"],["The passing of guilt is the true aim of therapy and the obvious aim of forgiveness.","Psychotherapy, part 2, section VII, paragraph 5, sentence 1"],["No unhealed healer can be wholly sane.","Psychotherapy, part 2, section VII, paragraph 5, sentence 8"],["The room becomes a temple, and the street a stream of stars that brushes lightly past all sickly dreams.","Psychotherapy, part 2, section VII, paragraph 8, sentence 4"],["The Thought of peace was given to God’s Son the instant that his mind had thought of war.","Workbook Part II, section 2, paragraph 2, sentence 1"],["Father, I will but to remember You.","Lesson 231, idea of the day"],["Father, I give You all my thoughts today.","Lesson 233, paragraph 1, sentence 1"],["I will step back and merely follow You.","Lesson 233, paragraph 1, sentence 6"],["Father, today I am Your Son again.","Lesson 234, idea of the day"],["Nothing has ever happened to disturb the peace of God the Father and the Son.","Lesson 234, paragraph 1, sentence 4"],["We thank You, Father, that we cannot lose the memory of You and of Your Love.","Lesson 234, paragraph 2, sentence 1"],["God in His mercy wills that I be saved.","Lesson 235, idea of the day"],["Father, Your holiness is mine. Your Love created me, and made my sinlessness forever part of You.","Lesson 235, paragraph 2, sentences 1-2"],["Your Love created me, and made my sinlessness forever part of You.","Lesson 235, paragraph 2, sentence 2"],["I rule my mind, which I alone must rule.","Lesson 236, idea of the day"],["I thus direct my mind, which I alone can rule.","Lesson 236, paragraph 1, sentence 7"],["Father, my mind is open to Your Thoughts, and closed today to every thought but Yours.","Lesson 236, paragraph 2, sentence 1"],["I rule my mind, and offer it to You.","Lesson 236, paragraph 2, sentence 2"],["I will arise in glory, and allow the light in me to shine upon the world throughout the day.","Lesson 237, paragraph 1, sentence 2"],["Father, Your trust in me has been so great, I must be worthy.","Lesson 238, paragraph 1, sentence 1"],["The glory of my Father is my own.","Lesson 239, idea of the day"],["We thank you, Father, for the light that shines forever in us.","Lesson 239, paragraph 2, sentence 1"],["Fear is not justified in any form.","Lesson 240, idea of the day"],["The senses then will seek instead for witnesses to what is true.","Workbook Part II, section 4, paragraph 2, sentence 7"],["A madman’s dreams are frightening, and sin appears indeed to terrify.","Workbook Part II, section 4, paragraph 4, sentence 1"],["I am in need of nothing but the truth.","Lesson 251, idea of the day"],["All that I sought before I needed not, and did not even want.","Lesson 251, paragraph 1, sentence 3"],["All that I sought before I needed not, and did not even want. My only need I did not recognise.","Lesson 251, paragraph 1, sentences 3-4"],["My only need I did not recognise.","Lesson 251, paragraph 1, sentence 4"],["The Son of God is my Identity.","Lesson 252, idea of the day"],["My Self is holy beyond all the thoughts of holiness of which I now conceive.","Lesson 252, paragraph 1, sentence 1"],["You are the Self Whom You created Son, creating like Yourself and one with You.","Lesson 253, paragraph 2, sentence 1"],["Father, today I would but hear Your Voice.","Lesson 254, paragraph 1, sentence 1"],["God’s Son can have no cares, and must remain forever in the peace of Heaven.","Lesson 255, paragraph 1, sentence 5"],["God is the only goal I have today.","Lesson 256, idea of the day"],["The way to God is through forgiveness here.","Lesson 256, paragraph 1, sentence 1"],["Father, forgiveness is Your chosen means for our salvation.","Lesson 257, paragraph 2, sentence 1"],["God is our only goal, our only Love.","Lesson 258, paragraph 1, sentence 4"],["Sin is the only thought that makes the goal of God seem unattainable.","Lesson 259, paragraph 1, sentence 1"],["Father, I would not be insane today.","Lesson 259, paragraph 2, sentence 1"],["Father, I did not make myself, although in my insanity I thought I did.","Lesson 260, paragraph 1, sentence 1"],["Your Son, my Father, calls on You today.","Lesson 260, paragraph 1, sentence 3"],["Holy indeed are we, because our Source can know no sin.","Lesson 260, paragraph 2, sentence 2"],["To the ego the goal is death, which is its end.","Chapter 15, section I, paragraph 2, sentence 8"],["The belief in hell is inescapable to those who identify with the ego.","Chapter 15, section I, paragraph 4, sentence 1"],["No one who follows the ego’s teaching is without the fear of death.","Chapter 15, section I, paragraph 4, sentence 7"],["The Holy Spirit teaches thus: There is no hell.","Chapter 15, section I, paragraph 7, sentence 1"],["The belief in hell is what prevents you from understanding the present, because you are afraid of it.","Chapter 15, section I, paragraph 7, sentence 3"],["The Holy Spirit leads as steadily to Heaven as the ego drives to hell.","Chapter 15, section I, paragraph 7, sentence 4"],["Fear is not of the present, but only of the past and future, which do not exist.","Chapter 15, section I, paragraph 8, sentence 2"],["Each instant is a clean, untarnished birth, in which the Son of God emerges from the past into the present.","Chapter 15, section I, paragraph 8, sentence 4"],["Time is inconceivable without change, yet holiness does not change.","Chapter 15, section I, paragraph 10, sentence 1"],["Change is an illusion, taught by those who cannot see themselves as guiltless.","Chapter 15, section I, paragraph 10, sentence 5"],["Miracles are the instants of release you offer, and will receive.","Chapter 15, section I, paragraph 12, sentence 4"],["In the crystal cleanness of the release you give is your instantaneous escape from guilt.","Chapter 15, section I, paragraph 13, sentence 7"],["You must be holy if you offer holiness.","Chapter 15, section I, paragraph 13, sentence 8"],["Time is your friend, if you leave it to the Holy Spirit to use.","Chapter 15, section I, paragraph 15, sentence 1"],["Holiness lies not in time, but in eternity.","Chapter 15, section I, paragraph 15, sentence 4"],["You do not realise how much you have misused your brothers by seeing them as sources of ego support.","Chapter 15, section II, paragraph 4, sentence 1"],["A Son of God who has been released through the Holy Spirit in a brother is always recognised.","Chapter 15, section II, paragraph 4, sentence 7"],["You will doubt until you hear one witness whom you have wholly released through the Holy Spirit.","Chapter 15, section II, paragraph 4, sentence 13"],["No gift of God is recognised in any other way.","Chapter 15, section II, paragraph 5, sentence 3"],["You can practise the mechanics of the holy instant, and will learn much from doing so.","Chapter 15, section II, paragraph 5, sentence 4"],["You are free to try as many as you wish, but all you will be doing is to delay your homecoming.","Chapter 15, section III, paragraph 2, sentence 5"],["The power of God will support every effort you make on behalf of His dear Son.","Chapter 15, section III, paragraph 4, sentence 8"],["God is not willing that His Son be content with less than everything.","Chapter 15, section III, paragraph 4, sentence 10"],["Every decision you make is for Heaven or for hell, and brings you the awareness of what you decided for.","Chapter 15, section III, paragraph 5, sentence 7"],["All honour is due the host of God.","Chapter 15, section III, paragraph 6, sentence 7"],["God would have His host abide in perfect freedom.","Chapter 15, section IV, paragraph 3, sentence 5"],["You can claim the holy instant any time and anywhere you want it.","Chapter 15, section IV, paragraph 4, sentence 4"],["Complexity is of the ego, and is nothing more than the ego’s attempt to obscure the obvious.","Chapter 15, section IV, paragraph 6, sentence 2"],["You believe you can harbour thoughts you would not share, and that salvation lies in keeping thoughts to yourself alone.","Chapter 15, section IV, paragraph 7, sentence 3"],["The necessary condition for the holy instant does not require that you have no thoughts that are not pure.","Chapter 15, section IV, paragraph 9, sentence 1"],["Judgement always rests on the past, for past experience is the basis on which you judge.","Chapter 15, section V, paragraph 1, sentence 3"],["You cannot love parts of reality and understand what love means.","Chapter 15, section V, paragraph 3, sentence 1"],["Because of guilt, all special relationships have elements of fear in them.","Chapter 15, section V, paragraph 4, sentence 1"],["The Holy Spirit knows no one is special.","Chapter 15, section V, paragraph 5, sentence 1"],["Any relationship you would substitute for another has not been offered to the Holy Spirit for His use.","Chapter 15, section V, paragraph 6, sentence 1"],["If you would attempt to substitute one aspect of love for another, you have placed less value on one and more on the other.","Chapter 15, section V, paragraph 6, sentence 3"],["All your relationships are blessed in the holy instant, because the blessing is not limited.","Chapter 15, section V, paragraph 10, sentence 1"],["God has created It beyond judgement, out of His need to extend His Love.","Chapter 15, section V, paragraph 11, sentence 2"],["With love in you, you have no need except to extend it.","Chapter 15, section V, paragraph 11, sentence 3"],["All separation vanishes as holiness is shared.","Chapter 15, section VI, paragraph 3, sentence 1"],["You do not find it difficult to believe that when another calls on God for love, your call remains as strong.","Chapter 15, section VI, paragraph 4, sentence 1"],["In the world of scarcity, love has no meaning and peace is impossible.","Chapter 15, section VI, paragraph 5, sentence 1"],["The laws of this world cease to hold any meaning at all.","Chapter 15, section VI, paragraph 5, sentence 9"],["To the ego the mind is private, and only the body can be shared.","Chapter 15, section VII, paragraph 8, sentence 5"],["The fury of those joined at the ego’s altar far exceeds your awareness of it.","Chapter 15, section VII, paragraph 9, sentence 6"],["The Holy Spirit cannot teach through fear.","Chapter 15, section VII, paragraph 11, sentence 1"],["Forgiveness lies in communication as surely as damnation lies in guilt.","Chapter 15, section VII, paragraph 13, sentence 1"],["In the holy instant guilt holds no attraction, since communication has been restored.","Chapter 15, section VII, paragraph 14, sentence 2"],["The loneliness of God’s Son is the loneliness of his Father.","Chapter 15, section VIII, paragraph 3, sentence 2"],["In the Holy Spirit alone lies the awareness of what God cannot know, and what you do not understand.","Chapter 15, section VIII, paragraph 6, sentence 1"],["God is ready now, but you are not.","Chapter 15, section IX, paragraph 1, sentence 7"],["The body is the symbol of the ego, as the ego is the symbol of the separation.","Chapter 15, section IX, paragraph 2, sentence 3"],["Limits are demanded by the ego, and represent its demands to make little and ineffectual.","Chapter 15, section IX, paragraph 4, sentence 3"],["You have no conception of the limits you have placed on your perception, and no idea of all the loveliness that you could see.","Chapter 15, section IX, paragraph 6, sentence 1"],["In the holy instant there are no bodies, and you experience only the attraction of God.","Chapter 15, section IX, paragraph 7, sentence 3"],["The time of Christ is the time appointed for the gift of freedom, offered to everyone.","Chapter 15, section X, paragraph 3, sentence 6"],["Your confusion of sacrifice and love is so profound that you cannot conceive of love without sacrifice.","Chapter 15, section X, paragraph 5, sentence 8"],["Guilt cannot last when the idea of sacrifice has been removed.","Chapter 15, section X, paragraph 5, sentence 11"],["As host to the ego, you believe that you can give all your guilt away whenever you want, and thereby purchase peace.","Chapter 15, section X, paragraph 6, sentence 1"],["You are unwilling to recognise that the ego, which you invited, is treacherous only to those who think they are its host.","Chapter 15, section X, paragraph 6, sentence 4"],["You must choose between total freedom and total bondage, for there are no alternatives but these.","Chapter 15, section X, paragraph 9, sentence 3"],["Salvation is simple, being of God, and therefore very easy to understand.","Chapter 15, section X, paragraph 9, sentence 6"],["In you are both the question and the answer; the demand for sacrifice and the peace of God.","Chapter 15, section X, paragraph 9, sentence 8"],["Your brothers and your Father have become very fearful to you.","Chapter 15, section XI, paragraph 1, sentence 3"],["Love must be total to give Him welcome, for the Presence of holiness creates the holiness that surrounds it.","Chapter 15, section XI, paragraph 2, sentence 8"],["It can lead only to mutual progress.","Chapter 4, introduction, paragraph 2, sentence 4"],["You believe that if you allow no change to enter into your ego you will find peace.","Chapter 4, section I, paragraph 2, sentence 4"],["Nothing can reach spirit from the ego, and nothing can reach the ego from spirit.","Chapter 4, section I, paragraph 2, sentence 6"],["Your self and God’s Self are in opposition.","Chapter 4, section I, paragraph 2, sentence 9"],["Spirit need not be taught, but the ego must be.","Chapter 4, section I, paragraph 3, sentence 1"],["Egos can clash in any situation, but spirit cannot clash at all.","Chapter 4, section I, paragraph 6, sentence 1"],["Your ego is never at stake because God did not create it.","Chapter 4, section I, paragraph 7, sentence 8"],["You are part of reality, which stands unchanged beyond the reach of your ego but within easy reach of spirit.","Chapter 4, section I, paragraph 8, sentence 5"],["God is not the author of fear.","Chapter 4, section I, paragraph 9, sentence 1"],["You are not at peace because you are not fulfilling your function.","Chapter 4, section I, paragraph 9, sentence 4"],["You are not at peace because you are not fulfilling your function. God gave you a very lofty function that you are not meeting.","Chapter 4, section I, paragraph 9, sentences 4-5"],["God gave you a very lofty function that you are not meeting.","Chapter 4, section I, paragraph 9, sentence 5"],["God gave you a very lofty function that you are not meeting. Your ego has chosen to be afraid instead of meeting it.","Chapter 4, section I, paragraph 9, sentences 5-6"],["Your ego has chosen to be afraid instead of meeting it.","Chapter 4, section I, paragraph 9, sentence 6"],["Your investment is great now because fear is a witness to the separation, and your ego rejoices when you witness to it.","Chapter 4, section I, paragraph 10, sentence 2"],["God is as incapable of creating the perishable as the ego is of making the eternal.","Chapter 4, section I, paragraph 11, sentence 7"],["Spirit is far beyond the need of your protection or mine.","Chapter 4, section I, paragraph 13, sentence 8"],["Perception, however, is always specific, and therefore quite concrete.","Chapter 4, section II, paragraph 1, sentence 5"],["Your own state of mind is a good example of how the ego was made.","Chapter 4, section II, paragraph 3, sentence 1"],["You react to your ego much as God does to His creations,—with love, protection and charity.","Chapter 4, section II, paragraph 4, sentence 4"],["Your reactions to the self you made are not surprising.","Chapter 4, section II, paragraph 4, sentence 5"],["The question is not how you respond to the ego, but what you believe you are.","Chapter 4, section II, paragraph 4, sentence 7"],["Only those who have a real and lasting sense of abundance can be truly charitable.","Chapter 4, section II, paragraph 6, sentence 1"],["Body appetites are not physical in origin.","Chapter 4, section II, paragraph 7, sentence 7"],["The ego’s ceaseless attempts to gain the spirit’s acknowledgement and thus establish its own existence are useless.","Chapter 4, section II, paragraph 8, sentence 5"],["Spirit in its knowledge is unaware of the ego.","Chapter 4, section II, paragraph 8, sentence 6"],["The whole value of right perception lies in the inevitable realisation that all perception is unnecessary.","Chapter 4, section II, paragraph 11, sentence 3"],["Spirit is immortal, and immortality is a constant state.","Chapter 4, section II, paragraph 11, sentence 9"],["Your creations are no more fatherless than you are.","Chapter 4, section III, paragraph 1, sentence 9"],["Your ego and your spirit will never be co-creators, but your spirit and your Creator will always be.","Chapter 4, section III, paragraph 1, sentence 10"],["Your mind is filled with schemes to save the face of your ego, and you do not seek the face of Christ.","Chapter 4, section IV, paragraph 1, sentence 5"],["Your mind is one with God’s.","Chapter 4, section IV, paragraph 2, sentence 7"],["Your mind and mine can unite in shining your ego away, releasing the strength of God into everything you think and do.","Chapter 4, section IV, paragraph 8, sentence 3"],["Judgement, like any other defence, can be used to attack or protect; to hurt or to heal.","Chapter 4, section IV, paragraph 8, sentence 7"],["Without your own allegiance, protection and love, the ego cannot exist.","Chapter 4, section IV, paragraph 8, sentence 9"],["Your mind will elect to join with mine, and together we are invincible.","Chapter 4, section IV, paragraph 11, sentence 5"],["A major source of the ego’s off-balanced state is its lack of discrimination between the body and the Thoughts of God.","Chapter 4, section V, paragraph 2, sentence 1"],["The body is the ego’s home by its own election.","Chapter 4, section V, paragraph 4, sentence 1"],["Only your allegiance to it gives the ego any power over you.","Chapter 4, section VI, paragraph 1, sentence 2"],["In learning to escape from illusions, your debt to your brother is something you must never forget.","Chapter 4, section VI, paragraph 2, sentence 1"],["The rewards of God, however, are immediately recognised as eternal.","Chapter 4, section VI, paragraph 3, sentence 5"],["Salvation is a collaborative venture.","Chapter 4, section VI, paragraph 8, sentence 2"],["Ego illusions are quite specific, although the mind is naturally abstract.","Chapter 4, section VII, paragraph 1, sentence 2"],["The concrete part believes in the ego, because the ego depends on the concrete.","Chapter 4, section VII, paragraph 1, sentence 4"],["Everything the ego perceives is a separate whole, without the relationships that imply being.","Chapter 4, section VII, paragraph 2, sentence 1"],["Nothing real can be increased except by sharing.","Chapter 4, section VII, paragraph 5, sentence 2"],["In the state of being the mind gives everything always.","Chapter 4, section VII, paragraph 5, sentence 8"],["God is praised whenever any mind learns to be wholly helpful.","Chapter 4, section VII, paragraph 8, sentence 1"],["I am God’s Son, complete and healed and whole, shining in the reflection of His Love.","Workbook Part II, section 14, paragraph 1, sentence 1"],["In me is love perfected, fear impossible, and joy established without opposite.","Workbook Part II, section 14, paragraph 1, sentence 3"],["We are the bringers of salvation. We accept our part as saviours of the world; which through our joint forgiveness is redeemed.","Workbook Part II, section 14, paragraph 3, sentences 1-2"],["We accept our part as saviours of the world; which through our joint forgiveness is redeemed.","Workbook Part II, section 14, paragraph 3, sentence 2"],["We look on everyone as brother, and perceive all things as kindly and as good.","Workbook Part II, section 14, paragraph 3, sentence 4"],["We do not seek a function that is past the gate of Heaven.","Workbook Part II, section 14, paragraph 3, sentence 5"],["We are concerned only with giving welcome to the truth.","Workbook Part II, section 14, paragraph 3, sentence 7"],["Ours are the eyes through which Christ’s vision sees a world redeemed from every thought of sin.","Workbook Part II, section 14, paragraph 4, sentence 1"],["Ours are the ears that hear the Voice for God proclaim the world as sinless.","Workbook Part II, section 14, paragraph 4, sentence 2"],["Ours the minds that join together as we bless the world.","Workbook Part II, section 14, paragraph 4, sentence 3"],["We bring glad tidings to the Son of God, who thought he suffered.","Workbook Part II, section 14, paragraph 5, sentence 3"],["My sinless brother is my guide to peace.","Lesson 351, idea of the day"],["My sinless brother is my guide to peace.","Lesson 351, idea of the day"],["Judgement and love are opposites.","Lesson 352, idea of the day"],["Judgement will bind my eyes and make me blind.","Lesson 352, paragraph 1, sentence 3"],["Father, I would hear Your Voice and find Your peace today.","Lesson 352, paragraph 1, sentence 8"],["We stand together, Christ and I, in peace And certainty of purpose.","Lesson 354, idea of the day"],["My oneness with the Christ establishes me as Your Son, beyond the reach of time, and wholly free of every law but Yours.","Lesson 354, paragraph 1, sentence 1"],["I have no self except the Christ in me.","Lesson 354, paragraph 1, sentence 2"],["I am sure my treasure waits for me, and I need but reach out my hand to find it.","Lesson 355, paragraph 1, sentence 3"],["I need not wait an instant more to be at peace forever.","Lesson 355, paragraph 1, sentence 6"],["Sickness is but another name for sin.","Lesson 356, idea of the day"],["No call to God can be unheard nor left Unanswered.","Lesson 358, idea of the day"],["You speak for God, and so You speak for me.","Lesson 358, paragraph 1, sentence 2"],["God’s answer is some form of peace.","Lesson 359, idea of the day"],["Perception has a focus.","Lesson 181, paragraph 2, sentence 1"],["Your vision now will shift, to give support to the intent which has replaced the one you held before.","Lesson 181, paragraph 2, sentence 4"],["This world you seem to live in is not home to you.","Lesson 182, paragraph 1, sentence 1"],["Christ is reborn as but a little Child each time a wanderer would leave his home.","Lesson 182, paragraph 10, sentence 1"],["Christ has called you friend and brother.","Lesson 182, paragraph 11, sentence 2"],["God’s Name is holy, but no holier than yours.","Lesson 183, paragraph 1, sentence 1"],["God’s Name can not be heard without response, nor said without an echo in the mind that calls you to remember.","Lesson 183, paragraph 2, sentence 1"],["You can escape all bondage of the world, and give the world the same release you found.","Lesson 183, paragraph 9, sentence 2"],["His Father’s Thoughts become his own.","Lesson 183, paragraph 10, sentence 4"],["Learning that stops with what the world would teach stops short of meaning.","Lesson 184, paragraph 7, sentence 4"],["You have need to use the symbols of the world a while.","Lesson 184, paragraph 9, sentence 2"],["All names are unified; all space is filled with truth’s reflection.","Lesson 184, paragraph 12, sentence 3"],["All names are unified; all space is filled with truth’s reflection. Every gap is dosed, and separation healed.","Lesson 184, paragraph 12, sentences 3-4"],["Every gap is dosed, and separation healed.","Lesson 184, paragraph 12, sentence 4"],["No one can fail who seeks the meaning of the Name of God.","Lesson 184, paragraph 13, sentence 1"],["All our mistakes we give to You, that we may be absolved from all effects our errors seemed to have.","Lesson 184, paragraph 15, sentence 5"],["Your Name unites us in the oneness which is our inheritance and peace.","Lesson 184, paragraph 15, sentence 8"],["I want the peace of God.","Lesson 185, idea of the day"],["To each, the hero of the dream is different; the outcome wanted not the same for both.","Lesson 185, paragraph 3, sentence 4"],["The meaning must escape the dream, for compromising is the goal of dreaming.","Lesson 185, paragraph 4, sentence 3"],["The meaning must escape the dream, for compromising is the goal of dreaming. Minds cannot unite in dreams.","Lesson 185, paragraph 4, sentences 3-4"],["Minds cannot unite in dreams.","Lesson 185, paragraph 4, sentence 4"],["You choose God’s peace, or you have asked for dreams.","Lesson 185, paragraph 9, sentence 4"],["You want the peace of God. And so do all who seem to seek for dreams.","Lesson 185, paragraph 10, sentences 1-2"],["And so do all who seem to seek for dreams.","Lesson 185, paragraph 10, sentence 2"],["No one who truly seeks the peace of God can fail to find it.","Lesson 185, paragraph 11, sentence 1"],["The peace of God is yours.","Lesson 185, paragraph 11, sentence 5"],["No gift of God can be unshared.","Lesson 185, paragraph 12, sentence 4"],["Our minds are suited perfectly to take the part assigned to us by One Who knows us well.","Lesson 186, paragraph 2, sentence 7"],["Sin can not tarnish the truth in you, and misery can come not near the holy home of God.","Lesson 186, paragraph 6, sentence 5"],["Salvation of the world depends on you who can forgive.","Lesson 186, paragraph 14, sentence 5"],["The truth maintains that giving will increase what you possess.","Lesson 187, paragraph 1, sentence 8"],["The thought remains, and grows in strength as it is reinforced by giving.","Lesson 187, paragraph 5, sentence 3"],["The thought of sacrifice gives rise to all the forms that suffering appears to take.","Lesson 187, paragraph 7, sentence 4"],["The great illusion of the fear of God diminishes to nothingness before the purity that you will look on here.","Lesson 187, paragraph 9, sentence 3"],["The Name of God is on our lips.","Lesson 187, paragraph 10, sentence 4"],["Light is not of the world, yet you who bear the light in you are alien here as well.","Lesson 188, paragraph 1, sentence 5"],["The peace of God is shining in you now, and from your heart extends around the world.","Lesson 188, paragraph 3, sentence 1"],["From you salvation radiates with gifts beyond all measure, given and returned.","Lesson 188, paragraph 4, sentence 2"],["The peace of God can never be contained.","Lesson 188, paragraph 5, sentence 1"],["The peace of God is shining in you now, and in all living things.","Lesson 188, paragraph 5, sentence 5"],["We practise coming nearer to the light in us today.","Lesson 188, paragraph 9, sentence 1"],["If you feel the Love of God within you, you will look out on a world of mercy and of love.","Lesson 189, paragraph 5, sentence 5"],["God will do His part in joyful and immediate response.","Lesson 189, paragraph 8, sentence 4"],["Father, we do not know the way to You.","Lesson 189, paragraph 10, sentence 1"],["Pain is a wrong perspective.","Lesson 190, paragraph 1, sentence 1"],["If God is real, there is no pain.","Lesson 190, paragraph 3, sentence 3"],["Nothing external to your mind can hurt or injure you in any way.","Lesson 190, paragraph 5, sentence 2"],["The world may seem to cause you pain.","Lesson 190, paragraph 7, sentence 1"],["Pain is the ransom you have gladly paid not to be free.","Lesson 190, paragraph 8, sentence 2"],["In pain does fear appear to triumph over love, and time replace eternity and Heaven.","Lesson 190, paragraph 8, sentence 4"],["Pain is but sleep; joy is awakening.","Lesson 190, paragraph 10, sentence 5"],["Pain is but sleep; joy is awakening. Pain is deception; joy alone is truth.","Lesson 190, paragraph 10, sentences 5-6"],["Pain is deception; joy alone is truth.","Lesson 190, paragraph 10, sentence 6"],["You do not see what you have done by giving to the world the role of jailer to the Son of God.","Lesson 191, paragraph 1, sentence 3"],["You play the game of death, of being helpless, pitifully tied to dissolution in a world which shows no mercy to you.","Lesson 191, paragraph 9, sentence 3"],["Creation cannot even be conceived of in the world.","Lesson 192, paragraph 3, sentence 1"],["Only forgiveness can restore the peace that God intended for His holy Son.","Lesson 192, paragraph 5, sentence 6"],["Only forgiveness can persuade the Son to look again upon his holiness.","Lesson 192, paragraph 5, sentence 7"],["Our understanding is so limited that what we think we understand is but confusion born of error.","Lesson 192, paragraph 7, sentence 3"],["The Son of God deserves your mercy.","Lesson 192, paragraph 10, sentence 2"],["How can you tell when you are seeing wrong, or someone else is failing to perceive the lesson he should learn?","Lesson 193, paragraph 8, sentence 1"],["Do not try to hold it off another day, another minute or another instant.","Lesson 193, paragraph 11, sentence 3"],["You are saved, and your salvation thus becomes the gift you give the world, because you have received.","Lesson 194, paragraph 2, sentence 3"],["In no one instant is depression felt, or pain experienced or loss perceived.","Lesson 194, paragraph 3, sentence 1"],["How pitiful and deprecating are such thoughts!","Lesson 195, paragraph 1, sentence 4"],["God has cared for us, and calls us Son.","Lesson 195, paragraph 9, sentence 5"],["Gratitude goes hand in hand with love, and where one is the other must be found.","Lesson 195, paragraph 10, sentence 2"],["You will not attack yourself, and you will realise that to attack another is but to at tack yourself.","Lesson 196, paragraph 1, sentence 2"],["You will be free of the insane belief that to attack a brother saves yourself.","Lesson 196, paragraph 1, sentence 3"],["You will not believe you are a body to be crucified.","Lesson 196, paragraph 3, sentence 3"],["The dreary, hopeless thought that you can make attacks on others and escape yourself has nailed you to the cross.","Lesson 196, paragraph 5, sentence 1"],["You cannot then believe that fear is caused without.","Lesson 196, paragraph 8, sentence 4"],["Nor need you hide in terror from the deadly fear of God projection hides behind.","Lesson 196, paragraph 9, sentence 3"],["The thing you dread the most is your salvation.","Lesson 196, paragraph 9, sentence 4"],["You have sought to be both weak and bound, because you feared your strength and freedom.","Lesson 196, paragraph 9, sentence 7"],["You make attempts at kindness and forgiveness.","Lesson 197, paragraph 1, sentence 2"],["Your gratitude is all your gifts require, that they be a lasting offering of a thankful heart, released from hell forever.","Lesson 197, paragraph 3, sentence 3"],["Nor can you dim the light of your perfection.","Lesson 197, paragraph 8, sentence 4"],["Nor can you dim the light of your perfection. In your heart the Heart of God is laid.","Lesson 197, paragraph 8, sentences 4-5"],["In your heart the Heart of God is laid.","Lesson 197, paragraph 8, sentence 5"],["Forgiveness is illusion that is answer to the rest.","Lesson 198, paragraph 2, sentence 10"],["Forgiveness is the only road that leads out of disaster, past all suffering, and finally away from death.","Lesson 198, paragraph 4, sentence 1"],["Dreams of any kind are strange and alien to the truth.","Lesson 198, paragraph 8, sentence 2"],["Freedom must be impossible as long as you perceive a body as yourself.","Lesson 199, paragraph 1, sentence 1"],["Freedom must be impossible as long as you perceive a body as yourself. The body is a limit.","Lesson 199, paragraph 1, sentences 1-2"],["The Holy Spirit is the home of minds that seek for freedom.","Lesson 199, paragraph 6, sentence 1"],["The body’s purpose now is unambiguous.","Lesson 199, paragraph 6, sentence 3"],["You are God’s Son. In immortality you live forever.","Lesson 199, paragraph 8, sentences 1-2"],["You will not find peace except the peace of God.","Lesson 200, paragraph 1, sentence 2"],["This world is not where you belong.","Lesson 200, paragraph 4, sentence 3"],["Freedom is given you where you beheld but chains and iron doors.","Lesson 200, paragraph 5, sentence 1"],["Peace is the bridge that everyone will cross, to leave this world behind.","Lesson 200, paragraph 8, sentence 1"],["We go to Heaven, and the path is straight.","Lesson 200, paragraph 9, sentence 2"],["The peace of God is ours, and only this will we accept and want.","Lesson 200, paragraph 11, sentence 3"],["Prayer is a way offered by the Holy Spirit to reach God.","The Song of Prayer, part 1, section I, paragraph 1, sentence 1"],["The secret of true prayer is to forget the things you think you need.","The Song of Prayer, part 1, section I, paragraph 4, sentence 1"],["Help in prayer does not mean that another mediates between you and God.","The Song of Prayer, part 1, section I, paragraph 6, sentence 3"],["Without guilt there is no scarcity.","The Song of Prayer, part 1, section II, paragraph 3, sentence 5"],["The earlier forms of prayer, at the bottom of the ladder, will not be free from envy and malice.","The Song of Prayer, part 1, section III, paragraph 2, sentence 1"],["Do not restrict your asking.","The Song of Prayer, part 1, section IV, paragraph 3, sentence 3"],["Creation is the sum of all God’s Thoughts, in number infinite, and everywhere without all limit.","Workbook Part II, section 11, paragraph 1, sentence 1"],["Creation is the opposite of all illusions, for creation is the truth.","Workbook Part II,
