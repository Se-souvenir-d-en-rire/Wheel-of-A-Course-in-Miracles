e to make against the truth.","Lesson 135, paragraph 17, sentence 1"],["Without defences, you become a light which Heaven gratefully acknowledges to be its own.","Lesson 135, paragraph 20, sentence 1"],["The aim of all defences is to keep the truth from being whole.","Lesson 136, paragraph 2, sentence 4"],["God knows not of your plans to change His Will.","Lesson 136, paragraph 11, sentence 1"],["You can but choose to think you die, or suffer sickness or distort the truth in any way.","Lesson 136, paragraph 11, sentence 4"],["The Thoughts of God are quite apart from time.","Lesson 136, paragraph 13, sentence 3"],["Sickness would prove that lies must be the truth.","Lesson 137, paragraph 4, sentence 1"],["The separation sickness would impose has never really happened.","Lesson 137, paragraph 4, sentence 3"],["The body seems to be more solid and more stable than the mind.","Lesson 137, paragraph 6, sentence 3"],["In this world Heaven is a choice, because here we believe there are alternatives to choose between.","Lesson 138, paragraph 1, sentence 1"],["Decision lets one of conflicting goals become the aim of effort and expenditure of time.","Lesson 138, paragraph 3, sentence 2"],["Without decision, time is but a waste and effort dissipated.","Lesson 138, paragraph 3, sentence 3"],["We recognise we make a conscious choice between what has existence and what has nothing but an appearance of the truth.","Lesson 138, paragraph 11, sentence 2"],["Nothing the world believes is true.","Lesson 139, paragraph 7, sentence 1"],["Peace be to you who have been cured in God, and not in idle dreams.","Lesson 140, paragraph 5, sentence 1"],["We will try today to find the source of healing, which is in our minds because our Father placed it there for us.","Lesson 140, paragraph 8, sentence 2"],["Our only preparation is to let our interfering thoughts be laid aside, not separately, but all of them as one.","Lesson 140, paragraph 11, sentence 2"],["We have no need to make them different, and thus delay the time when we can hear our Father speak to us.","Lesson 140, paragraph 11, sentence 4"],["Only appreciation is an appropriate response to your brother.","Chapter 12, section I, paragraph 6, sentence 1"],["Your interpretations of your brother’s needs are your interpretation of yours.","Chapter 12, section I, paragraph 7, sentence 1"],["By giving help you are asking for it, and if you perceive but one need in yourself you will be healed.","Chapter 12, section I, paragraph 7, sentence 2"],["Every appeal you answer in the Name of Christ brings the remembrance of your Father closer to your awareness.","Chapter 12, section I, paragraph 7, sentence 4"],["The Holy Spirit must still translate the fear into truth.","Chapter 12, section I, paragraph 8, sentence 3"],["If when you perceive it in others you learn to supply the loss, the basic cause of fear is removed.","Chapter 12, section I, paragraph 9, sentence 2"],["Thereby you teach yourself that fear does not exist in you.","Chapter 12, section I, paragraph 9, sentence 3"],["Fear and love are the only emotions of which you are capable.","Chapter 12, section I, paragraph 9, sentence 5"],["The veil that you have drawn across the face of love has disappeared.","Chapter 12, section I, paragraph 9, sentence 11"],["The Holy Spirit’s interpretation of fear does dispel it, for the awareness of truth cannot be denied.","Chapter 12, section I, paragraph 10, sentence 3"],["The task of the miracle worker thus becomes to deny the denial of truth .","Chapter 12, section II, paragraph 1, sentence 5"],["You still want what God wills, and no nightmare can defeat a child of God in his purpose.","Chapter 12, section II, paragraph 6, sentence 1"],["If you insist on refusing and experience a quick response of opposition, you are believing that your salvation lies in not doing it.","Chapter 12, section III, paragraph 2, sentence 3"],["Poverty is of the ego, and never of God.","Chapter 12, section III, paragraph 4, sentence 7"],["If only the loving thoughts of God’s Son are the world’s reality, the real world must be in his mind.","Chapter 12, section III, paragraph 7, sentence 1"],["God does love the real world, and those who perceive its reality cannot see the world of death.","Chapter 12, section III, paragraph 8, sentence 2"],["The world you perceive is a world of separation.","Chapter 12, section III, paragraph 9, sentence 1"],["You have defiled the altar, but not the world.","Chapter 12, section III, paragraph 10, sentence 4"],["The search the ego undertakes is therefore bound to be defeated.","Chapter 12, section IV, paragraph 2, sentence 1"],["The Holy Spirit offers you another promise, and one that will lead to joy.","Chapter 12, section IV, paragraph 4, sentence 4"],["You will undertake a journey because you are not at home in this world.","Chapter 12, section IV, paragraph 5, sentence 1"],["You do not remember how to look within for you do not believe your home is there.","Chapter 12, section IV, paragraph 5, sentence 4"],["If death is your treasure, you will sell everything else to purchase it.","Chapter 12, section IV, paragraph 6, sentence 4"],["You cannot trust your own love when you attack it.","Chapter 12, section V, paragraph 4, sentence 2"],["You do not know the meaning of love, and that is your handicap.","Chapter 12, section V, paragraph 6, sentence 1"],["You chose to forget your Father but you do not really want to do so, and therefore you can decide otherwise.","Chapter 12, section VI, paragraph 2, sentence 7"],["The Holy Spirit keeps the vision of Christ for every Son of God who sleeps.","Chapter 12, section VI, paragraph 4, sentence 5"],["Every child of God is one in Christ, for his being is in Christ as Christ’s is in God.","Chapter 12, section VI, paragraph 6, sentence 1"],["In every child of God His blessing lies, and in your blessing of the children of God is His blessing to you.","Chapter 12, section VII, paragraph 1, sentence 6"],["You cannot see the Holy Spirit, but you can see His manifestations.","Chapter 12, section VII, paragraph 4, sentence 1"],["As your function in Heaven is creation, so your function on earth is healing.","Chapter 12, section VII, paragraph 4, sentence 7"],["Your perception is the result of your invitation, coming to you as you sent for it.","Chapter 12, section VII, paragraph 5, sentence 2"],["The power of decision is your one remaining freedom as a prisoner of this world.","Chapter 12, section VII, paragraph 9, sentence 1"],["Through the eyes of Christ, only the real world exists and only the real world can be seen.","Chapter 12, section VII, paragraph 11, sentence 7"],["Everything you behold without is a judgement of what you beheld within.","Chapter 12, section VII, paragraph 12, sentence 4"],["You attack the real world every day and every hour and minute, and yet you are surprised that you cannot see it.","Chapter 12, section VIII, paragraph 1, sentence 3"],["If you seek love in order to attack it, you will never find it.","Chapter 12, section VIII, paragraph 1, sentence 4"],["God’s Son is as safe as his Father, for the Son knows his Father’s protection and cannot fear.","Chapter 12, section VIII, paragraph 2, sentence 1"],["The definition of reality is God’s, not yours.","Chapter 12, section VIII, paragraph 3, sentence 6"],["A Voice will answer every question you ask, and a vision will correct the perception of everything you see.","Chapter 12, section VIII, paragraph 4, sentence 3"],["God could not offer His Son what has no value, nor could His Son receive it.","Chapter 12, section VIII, paragraph 6, sentence 3"],["You have made invisible the only truth that this world holds.","Chapter 12, section VIII, paragraph 6, sentence 7"],["By making nothing real to you, you have seen it.","Chapter 12, section VIII, paragraph 6, sentence 9"],["God’s Son can be seen because his vision is shared.","Chapter 12, section VIII, paragraph 7, sentence 2"],["You looked upon the unreal and found despair.","Chapter 12, section VIII, paragraph 7, sentence 6"],["The real world was given you by God in loving exchange for the world you made and the world you see.","Chapter 12, section VIII, paragraph 8, sentence 1"],["Your Father could not cease to love His Son.","Chapter 12, section VIII, paragraph 8, sentence 9"],["What I see is the projection of my own errors of thought.","Lesson 51, paragraph 5, sentence 2"],["I call this seeing.","Lesson 52, paragraph 3, sentence 2"],["What is producing this world is insane, and so is what it produces.","Lesson 53, paragraph 1, sentence 2"],["Nothing in madness is dependable.","Lesson 53, paragraph 5, sentence 2"],["They must be one or the other.","Lesson 54, paragraph 1, sentence 6"],["The world I see attests to the fearful nature of the self-image I have made.","Lesson 56, paragraph 3, sentence 2"],["How can I be the victim of a world that can be completely undone if I so choose?","Lesson 57, paragraph 1, sentence 1"],["How can I be alone when God always goes with me?","Lesson 59, paragraph 1, sentence 1"],["I can see what God wants me to see.","Lesson 59, paragraph 5, sentence 1"],["It is these I choose when I think I can see apart from Him.","Lesson 59, paragraph 5, sentence 4"],["I am the light of the world.","Lesson 61, idea of the day"],["You are the light of the world. God has built His plan for the salvation of His Son on you.","Lesson 61, paragraph 7, sentences 5-6"],["God has built His plan for the salvation of His Son on you.","Lesson 61, paragraph 7, sentence 6"],["Forgiveness is the demonstration that you are the light of the world.","Lesson 62, paragraph 1, sentence 3"],["Illusions about yourself and the world are one.","Lesson 62, paragraph 2, sentence 1"],["How holy are you who have the power to bring peace to every mind?","Lesson 63, paragraph 1, sentence 1"],["You are indeed the light of the world with such a function.","Lesson 63, paragraph 2, sentence 1"],["You are indeed the light of the world with such a function. The Son of God looks to you for his redemption.","Lesson 63, paragraph 2, sentences 1-2"],["The Son of God looks to you for his redemption.","Lesson 63, paragraph 2, sentence 2"],["We will begin the day by acknowledging it, and close the day with the thought of it in our awareness.","Lesson 63, paragraph 3, sentence 2"],["The purpose of the world you see is to obscure your function of forgiveness, and provide you with a justification for forgetting it.","Lesson 64, paragraph 1, sentence 2"],["To the Holy Spirit, the world is a place where you learn to forgive yourself what you think of as your sins.","Lesson 64, paragraph 2, sentence 3"],["Salvation cannot be the only purpose you hold while you still cherish others.","Lesson 65, paragraph 1, sentence 4"],["After a while, interfering thoughts will become harder to find.","Lesson 65, paragraph 6, sentence 1"],["We will not indulge the ego by listening to its attacks on truth.","Lesson 66, paragraph 3, sentence 4"],["The first premise is that God gives you only happiness.","Lesson 66, paragraph 6, sentence 1"],["The second premise is that God has given you your function.","Lesson 66, paragraph 7, sentence 1"],["You will listen to madness or hear the truth.","Lesson 66, paragraph 10, sentence 1"],["No one can look upon what your grievances conceal.","Lesson 69, paragraph 1, sentence 1"],["We are literally attempting to get in touch with the salvation of the world.","Lesson 69, paragraph 2, sentence 3"],["We are trying to let the veil be lifted, and to see the tears of God’s Son disappear in the sunlight.","Lesson 69, paragraph 2, sentence 5"],["My salvation comes from me.","Lesson 70, idea of the day"],["Salvation seems to come from anywhere except from you.","Lesson 70, paragraph 1, sentence 2"],["You see neither guilt nor salvation as in your own mind and nowhere else.","Lesson 70, paragraph 1, sentence 4"],["Your purpose was to ensure that healing did not occur.","Lesson 70, paragraph 4, sentence 2"],["It is not there.","Lesson 70, paragraph 7, sentence 8"],["You may not realise that the ego has set up a plan for salvation in opposition to God’s.","Lesson 71, paragraph 1, sentence 1"],["The change of mind necessary for salvation is thus demanded of everyone and everything except yourself.","Lesson 71, paragraph 2, sentence 5"],["God’s plan for your salvation will work, and other plans will not.","Lesson 71, paragraph 8, sentence 2"],["The ego’s fundamental wish is to replace God.","Lesson 72, paragraph 2, sentence 1"],["You are doing more than failing to help in freeing him from the body’s limitations.","Lesson 72, paragraph 4, sentence 3"],["As a body, do not let yourself be deprived of what the body offers.","Lesson 72, paragraph 6, sentence 5"],["God gave you nothing. The body is your only saviour.","Lesson 72, paragraph 6, sentences 7-8"],["Your upside-down perception has been ruinous to your peace of mind.","Lesson 72, paragraph 8, sentence 3"],["You have seen yourself in a body and the truth outside you, locked away from your awareness by the body’s limitations.","Lesson 72, paragraph 8, sentence 4"],["The light of truth is in us, where it was placed by God.","Lesson 72, paragraph 9, sentence 1"],["We are asking it of truth. Be certain, then, that the answer will be true because of Whom you ask.","Lesson 72, paragraph 11, sentences 6-7"],["Be certain, then, that the answer will be true because of Whom you ask.","Lesson 72, paragraph 11, sentence 7"],["I will there be light.","Lesson 73, idea of the day"],["Idle wishes and grievances are partners or co-makers in picturing the world you see.","Lesson 73, paragraph 2, sentence 1"],["Beholding them, you do not know your brothers or your Self.","Lesson 73, paragraph 2, sentence 5"],["The ego’s idle wishes have been withdrawn.","Lesson 73, paragraph 4, sentence 5"],["Your picture of the world can only mirror what is within.","Lesson 73, paragraph 5, sentence 1"],["Grievances darken your mind, and you look out on a darkened world.","Lesson 73, paragraph 5, sentence 3"],["Forgiveness lifts the darkness, reasserts your will, and lets you look upon a world of light.","Lesson 73, paragraph 5, sentence 4"],["We will succeed today if you remember that you want salvation for yourself.","Lesson 73, paragraph 7, sentence 1"],["You want to accept God’s plan because you share in it.","Lesson 73, paragraph 7, sentence 2"],["You have no will that can really oppose it, and you do not want to do so.","Lesson 73, paragraph 7, sentence 3"],["You have no will that can really oppose it, and you do not want to do so. Salvation is for you.","Lesson 73, paragraph 7, sentences 3-4"],["Salvation is for you. Above all else, you want the freedom to remember who you really are.","Lesson 73, paragraph 7, sentences 4-5"],["Above all else, you want the freedom to remember who you really are.","Lesson 73, paragraph 7, sentence 5"],["No idle wishes can detain us, nor deceive us with an illusion of strength.","Lesson 73, paragraph 8, sentence 2"],["You will succeed today, the time appointed for the release of the Son of God from hell and from all idle wishes.","Lesson 73, paragraph 9, sentence 4"],["God’s is the only Will.","Lesson 74, paragraph 1, sentence 2"],["Peace has replaced the strange idea that you are torn by conflicting goals.","Lesson 74, paragraph 1, sentence 5"],["You are healed and you can heal.","Lesson 75, paragraph 1, sentence 2"],["You are at peace, and you bring peace with you wherever you go.","Lesson 75, paragraph 1, sentence 5"],["We will to see the light; the light has come.","Lesson 75, paragraph 3, sentence 5"],["Sight is given us, now that the light has come.","Lesson 75, paragraph 4, sentence 5"],["We do not want to see the ego’s shadow on the world today.","Lesson 75, paragraph 5, sentence 1"],["The body’s suffering is a mask the mind holds up to hide what really suffers.","Lesson 76, paragraph 5, sentence 4"],["The laws of God can never be replaced.","Lesson 76, paragraph 7, sentence 1"], ess deeper, and you could not see.","Lesson 78, paragraph 3, sentence 4"],["We will select one person you have used as target for your grievances, and lay the grievances aside and look at him.","Lesson 78, paragraph 4, sentence 4"],["The problem of separation, which is really the only problem, has already been solved.","Lesson 79, paragraph 1, sentence 4"],["The temptation to regard problems as many is the temptation to keep the problem of separation unsolved.","Lesson 79, paragraph 4, sentence 1"],["The world seems to present you with a vast number of problems, each requiring a different answer.","Lesson 79, paragraph 4, sentence 2"],["No one could solve all the problems the world appears to hold.","Lesson 79, paragraph 5, sentence 1"],["We will try to free our minds of all the many different kinds of problems we think we have.","Lesson 79, paragraph 7, sentence 3"],["You have laid deception aside, and seen the light of truth.","Lesson 80, paragraph 2, sentence 4"],["You have laid deception aside, and seen the light of truth. You have accepted salvation for yourself by bringing the problem to the answer.","Lesson 80, paragraph 2, sentences 4-5"],["You have accepted salvation for yourself by bringing the problem to the answer.","Lesson 80, paragraph 2, sentence 5"],["You are entitled to peace today.","Lesson 80, paragraph 3, sentence 1"],["The problem must be gone, because God’s answer cannot fail.","Lesson 80, paragraph 4, sentence 2"],["God takes you where you are and welcomes you.","Manual for Teachers, question 26, introduction, paragraph 4, sentence 10"],["The surface traits of God’s teachers are not at all alike.","Manual for Teachers, question 4, introduction, paragraph 2, sentence 1"],["Perception is the result of learning.","Manual for Teachers, question 4, section I, paragraph 1, sentence 2"],["He thought he learned willingness, but now he sees that he does not know what the willingness is for.","Manual for Teachers, question 4, section I, paragraph 8, sentence 6"],["Conflict is the inevitable result of self-deception, and self-deception is dishonesty.","Manual for Teachers, question 4, section II, paragraph 2, sentence 4"],["Judgement without self-deception is impossible.","Manual for Teachers, question 4, section III, paragraph 1, sentence 3"],["Judgement without self-deception is impossible. Judgement implies that you have been deceived in your brothers.","Manual for Teachers, question 4, section III, paragraph 1, sentences 3-4"],["Judgement implies that you have been deceived in your brothers.","Manual for Teachers, question 4, section III, paragraph 1, sentence 4"],["Judgement destroys honesty and shatters trust.","Manual for Teachers, question 4, section III, paragraph 1, sentence 10"],["Joy is the inevitable result of gentleness.","Manual for Teachers, question 4, section V, paragraph 1, sentence 1"],["Joy goes with gentleness as surely as grief attends attack.","Manual for Teachers, question 4, section V, paragraph 1, sentence 8"],["True faithfulness, however, does not deviate.","Manual for Teachers, question 4, section IX, paragraph 2, sentence 1"],["Forgiveness is the final goal of the curriculum.","Manual for Teachers, question 4, section X, paragraph 2, sentence 9"],["The world was made as an attack on God.","Workbook Part II, section 3, paragraph 2, sentence 1"],["The mechanisms of illusion have been born instead.","Workbook Part II, section 3, paragraph 3, sentence 1"],["The day has come when sorrows pass away and pain is gone.","Lesson 241, paragraph 1, sentence 4"],["The day has come when sorrows pass away and pain is gone. The glory of salvation dawns today upon a world set free.","Lesson 241, paragraph 1, sentences 4-5"],["The glory of salvation dawns today upon a world set free.","Lesson 241, paragraph 1, sentence 5"],["We have forgiven one another now, and so we come at last to You again.","Lesson 241, paragraph 2, sentence 1"],["I will not lead my life alone today.","Lesson 242, paragraph 1, sentence 1"],["I will not think I understand the whole from bits of my perception, which are all that I can see.","Lesson 243, paragraph 1, sentence 3"],["We are one because each part contains Your memory, and truth must shine in all of us as one.","Lesson 243, paragraph 2, sentence 3"],["I am in danger nowhere in the world.","Lesson 244, idea of the day"],["Your peace is with me, Father.","Lesson 245, idea of the day"],["I bring it to the desolate and lonely and afraid.","Lesson 245, paragraph 1, sentence 4"],["I give Your peace to those who suffer pain, or grieve for loss, or think they are bereft of hope and happiness.","Lesson 245, paragraph 1, sentence 5"],["Without forgiveness I will still be blind.","Lesson 247, idea of the day"],["Sin is the symbol of attack.","Lesson 247, paragraph 1, sentence 1"],["You stand forgiven, and I stand with you.","Lesson 247, paragraph 1, sentence 8"],["My brothers are Your Sons. Your Fatherhood created them, and gave them all to me as part of You, and my own Self as well.","Lesson 247, paragraph 2, sentences 2-3"],["Your Fatherhood created them, and gave them all to me as part of You, and my own Self as well.","Lesson 247, paragraph 2, sentence 3"],["Father, my ancient love for You returns, and lets me love Your Son again as well.","Lesson 248, paragraph 2, sentence 1"],["Father, my ancient love for You returns, and lets me love Your Son again as well. Father, I am as You created me.","Lesson 248, paragraph 2, sentences 1-2"],["Father, I am as You created me.","Lesson 248, paragraph 2, sentence 2"],["Forgiveness ends all suffering and loss.","Lesson 249, idea of the day"],["Forgiveness paints a picture of a world where suffering is over, loss becomes impossible and anger makes no sense.","Lesson 249, paragraph 1, sentence 1"],["The world becomes a place of joy, abundance, charity and endless giving.","Lesson 249, paragraph 1, sentence 5"],["Father, we would return our minds to You.","Lesson 249, paragraph 2, sentence 1"],["We have l but loving thoughts has been forgotten, what remains is eternal.","Chapter 17, section III, paragraph 5, sentence 3"],["The past becomes the justification for entering into a continuing, unholy alliance with the ego against the present.","Chapter 17, section III, paragraph 8, sentence 1"],["Only the Thoughts of God are true.","Chapter 17, section III, paragraph 9, sentence 7"],["You recognise, at least in general terms, that the ego is insane.","Chapter 17, section IV, paragraph 6, sentence 2"],["The special relationship has the most imposing and deceptive frame of all the defences the ego uses.","Chapter 17, section IV, paragraph 8, sentence 1"],["The picture of Heaven and eternity grows more convincing as you look at it.","Chapter 17, section IV, paragraph 14, sentence 3"],["The picture of light, in clear-cut and unmistakable contrast, is transformed into what lies beyond the picture.","Chapter 17, section IV, paragraph 15, sentence 1"],["The holy relationship is the expression of the holy instant in living in this world.","Chapter 17, section V, paragraph 1, sentence 1"],["Like everything about salvation, the holy instant is a practical device, witnessed to by its results.","Chapter 17, section V, paragraph 1, sentence 2"],["The holy relationship, a major step toward the perception of the real world, is learned.","Chapter 17, section V, paragraph 2, sentence 1"],["The holy relationship is a phenomenal teaching accomplishment.","Chapter 17, section V, paragraph 2, sentence 3"],["A relationship, undertaken by two individuals for their unholy purposes, suddenly has holiness for its goal.","Chapter 17, section V, paragraph 5, sentence 5"],["You can escape from your distress only by getting rid of your brother.","Chapter 17, section V, paragraph 7, sentence 2"],["You are very new in the ways of salvation, and think you have lost your way.","Chapter 17, section V, paragraph 9, sentence 1"],["Throughout the Sonship is the song of freedom heard, in joyous echo of your led. A miracle of healing proves that separation is without effect.","Chapter 27, section II, paragraph 5, sentences 1-2"],["A miracle of healing proves that separation is without effect.","Chapter 27, section II, paragraph 5, sentence 2"],["Brother, there is no death.","Chapter 27, section II, paragraph 6, sentence 8"],["If you assume correction’s role, you lose the function of forgiveness.","Chapter 27, section II, paragraph 10, sentence 3"],["In a split mind, identity must seem to be divided.","Chapter 27, section II, paragraph 11, sentence 1"],["Correction, to a mind so split, must be a way to punish sins you think are yours in someone else.","Chapter 27, section II, paragraph 11, sentence 3"],["No preparation can be made that would enhance the invitation’s real appeal.","Chapter 27, section III, paragraph 4, sentence 2"],["Forgiveness is not yet a power known as wholly free of limits.","Chapter 27, section III, paragraph 5, sentence 3"],["Forgiveness is the means by which the truth is represented temporarily.","Chapter 27, section III, paragraph 5, sentence 5"],["You do not know the peace of power that opposes nothing.","Chapter 27, section III, paragraph 7, sentence 6"],["The world can only ask a double question.","Chapter 27, section IV, paragraph 3, sentence 5"],["All questions asked within this world are but a way of looking, not a question asked.","Chapter 27, section IV, paragraph 4, sentence 1"],["The questions of the world but ask of whom is sacrifice demanded, asking not if sacrifice is meaningful at all.","Chapter 27, section IV, paragraph 6, sentence 7"],["In the holy instant, you can bring the question to the answer, and receive the answer that was made for you.","Chapter 27, section IV, paragraph 7, sentence 5"],["No one can ask another to be healed.","Chapter 27, section V, paragraph 1, sentence 6"],["No one is healed through double messages.","Chapter 27, section V, paragraph 2, sentence 4"],["No one is healed through double messages. If you wish dy.","Chapter 27, section VI, paragraph 4, sentence 1"],["The miracle makes no distinctions in the names by which sin’s witnesses are called.","Chapter 27, section VI, paragraph 5, sentence 1"],["The dying live, the dead arise, and pain has vanished.","Chapter 27, section VI, paragraph 5, sentence 9"],["The laws of sin have different witnesses with different strengths.","Chapter 27, section VI, paragraph 6, sentence 4"],["The resurrection of the world awaits your healing and your happiness, that you may demonstrate the healing of the world.","Chapter 27, section VI, paragraph 8, sentence 1"],["Suffering is an emphasis upon all that the world has done to injure you.","Chapter 27, section VII, paragraph 1, sentence 1"],["The part you play in salvaging the world from condemnation is your own escape.","Chapter 27, section VII, paragraph 6, sentence 1"],["The witnesses to sin all stand within one little space.","Chapter 27, section VII, paragraph 7, sentence 1"],["The gap between reality and dreams lies not between the dreaming of the world and what you dream in secret.","Chapter 27, section VII, paragraph 11, sentence 4"],["You are the dreamer of the world of dreams.","Chapter 27, section VII, paragraph 13, sentence 1"],["The dream of guilt is fading from your sight, although your eyes are closed.","Chapter 27, section VII, paragraph 14, sentence 6"],["The body is the central figure in the dreaming of the world.","Chapter 27, section VIII, paragraph 1, sentence 1"],["Into eternity, where all is one, there crept a tiny, mad idea, at which the Son of God remembered not to laugh.","Chapter 27, section VIII, paragraph 6, sentence 2"],["The world you see depicts exactly what you thought you did.","Chapter 27, section VIII, paragraph 7, sentence 2"],["In gentle laughter does the Holy Spirit perceive the cause, and looks not to effects.","Chapter 27, section VIII, paragraph 9, sentence 1"],["Very simply, the resurrection is the overcoming or surmounting of death.","Manual for e meaning of the Son of God lies solely in his relationship with his Creator.","Chapter 20, section VI, paragraph 1, sentence 1"],["The body does not intrude upon it. Any relationship in which the body enters is based not on love, but on idolatry.","Chapter 20, section VI, paragraph 2, sentences 3-4"],["Any relationship in which the body enters is based not on love, but on idolatry.","Chapter 20, section VI, paragraph 2, sentence 4"],["The body is the ego’s chosen weapon for seeking power through relationships.","Chapter 20, section VI, paragraph 4, sentence 3"],["The Holy Spirit’s temple is not a body, but a relationship.","Chapter 20, section VI, paragraph 5, sentence 1"],["The Holy Spirit does not build His temples where love can never be.","Chapter 20, section VI, paragraph 5, sentence 6"],["Is this the substitute you want for the eternal blessing of the holy instant and its unlimited beneficence?","Chapter 20, section VI, paragraph 8, sentence 3"],["To the extent you still experience it, you are refusing to leave the means to Him Who changed the purpose.","Chapter 20, section VII, paragraph 2, sentence 2"],["To obtain the goal the Holy Spirit indeed asks little.","Chapter 20, section VII, paragraph 3, sentence 1"],["The means seem real because the goal is valued.","Chapter 20, section VII, paragraph 7, sentence 6"],["The body cannot be looked upon except through judgement.","Chapter 20, section VII, paragraph 8, sentence 1"],["Your holy brother, sight of whom is your release, is no illusion.","Chapter 20, section VII, paragraph 8, sentence 7"],["Salvation is the Holy Spirit’s goal.","Chapter 20, section VII, paragraph 9, sentence 4"],["Salvation is the Holy Spirit’s goal. The means is vision.","Chapter 20, section VII, paragraph 9, sentences 4-5"],["Vision would not be necessary had judgement not been made.","Chapter 20, section VIII, paragraph 1, sentence 5"],["Vision is freely given to those who ask to see.","Chapter 20, section VIII, paragraph 2, sentence 10 enced some light and some thing.","Chapter 3, section II, paragraph 1, sentence 7"],["Innocent or true perception means that you never misperceive and always see truly.","Chapter 3, section II, paragraph 2, sentence 5"],["If nothing but the truth exists, right-minded seeing cannot see anything but perfection.","Chapter 3, section II, paragraph 3, sentence 5"],["Nothing can prevail against a Son of God who commends his Spirit into the Hands of his Father.","Chapter 3, section II, paragraph 5, sentence 1"],["You cannot make untruth true.","Chapter 3, section II, paragraph 6, sentence 2"],["If you are willing to accept what is true in everything you perceive, you let it be true for you.","Chapter 3, section II, paragraph 6, sentence 3"],["Truth overcomes all error, and those who live in error and emptiness can never find lasting solace.","Chapter 3, section II, paragraph 6, sentence 4"],["True perception is the basis for knowledge, but knowing is the affirmation of truth and beyond all perceptions.","Chapter 3, section III, paragraph 1, sentence 10"],["The miracle, being a way of perceiving, is not knowledge.","Chapter 3, section III, paragraph 2, sentence 4"],["Questioning illusions is the first step in undoing them.","Chapter 3, section III, paragraph 2, sentence 6"],["Questioning illusions is the first step in undoing them. The miracle, or the right answer, corrects them.","Chapter 3, section III, paragraph 2, sentences 6-7"],["The miracle, or the right answer, corrects them.","Chapter 3, section III, paragraph 2, sentence 7"],["Knowledge provides the strength for creative thinking, but not for right doing.","Chapter 3, section III, paragraph 5, sentence 8"],["Perception, miracles and doing are closely related.","Chapter 3, section III, paragraph 5, sentence 9"],["God is not a stranger to His Sons, and His Sons are not strangers to each other.","Chapter 3, section III, paragraph 6, sentence 3"],["Perception can and must be stabilised, but knowledge is stable.","Chap y lies, and builds kingdoms in which everything is in direct opposition to God.","Chapter 3, section VII, paragraph 2, sentence 6"],["Knowledge cannot deceive, but perception can.","Chapter 3, section VII, paragraph 4, sentence 5"],["Your starting point is truth, and you must return to your Beginning.","Chapter 3, section VII, paragraph 5, sentence 6"],["Your Self s still in peace, even though your mind is in conflict.","Chapter 3, section VII, paragraph 5, sentence 8"],["Life and death, light and darkness, knowledge and perception, are irreconcilable.","Chapter 3, section VII, paragraph 6, sentence 6"],["Only the oneness of knowledge is free of conflict.","Chapter 3, section VII, paragraph 6, sentence 8"],["Father, Christ’s vision is the way to You.","Lesson 271, paragraph 2, sentence 1"],["My home is set in Heaven by Your Will and mine.","Lesson 272, paragraph 1, sentence 2"],["I am surrounded by Your Love, forever still, forever gentle and forever safe.","Lesson 272, paragraph 1, sentence 7"],["I am surrounded by Your Love, forever still, forever gentle and forever safe. God’s Son must be as You created him.","Lesson 272, paragraph 1, sentences 7-8"],["God’s Son must be as You created him.","Lesson 272, paragraph 1, sentence 8"],["The stillness of the peace of God is mine.","Lesson 273, idea of the day"],["If we give way to a disturbance, let us learn how to dismiss it and return to peace.","Lesson 273, paragraph 1, sentence 3"],["A special blessing comes to us today, from Him Who is our Father.","Lesson 274, paragraph 2, sentence 1"],["God’s healing Voice protects all things today.","Lesson 275, idea of the day"],["Your healing Voice protects all things today, and so I leave all things to You.","Lesson 275, paragraph 2, sentence 1"],["Father, Your Voice protects all things through me.","Lesson 275, paragraph 2, sentence 5"],["The Word of God is given me to speak.","Lesson 276, idea of the day"],["If I am bound, my Father is not free.","Lesson 278, idea of the day"],["Father, I ask for nothing but the truth.","Lesson 278, paragraph 2, sentence 1"],["I choose the way to You instead of madness and instead of fear.","Lesson 278, paragraph 2, sentence 4"],["Creation’s freedom promises my own.","Lesson 279, idea of the day"],["The end of dreams is promised me, because God’s Son is not abandoned by His Love.","Lesson 279, paragraph 1, sentence 1"],["Father, I lay no limits on the Son You love and You created limitless.","Lesson 280, paragraph 2, sentence 2"],["The world of time is the world of illusion.","Manual for Teachers, question 2, introduction, paragraph 3, sentence 1"],["Choices made long since appear to be open; yet to be made.","Manual for Teachers, question 2, introduction, paragraph 3, sentence 3"],["You are free, however, to decide when you want to learn it.","Manual for Teachers, question 2, introduction, paragraph 3, sentence 7"],["God’s Will in everything but seems to take time in the working-out.","Manual for Teachers, question 2, introduction, paragraph 4, sentence 7"],["Reincarnation cannot, then, be true in any real sense.","Manual for Teachers, question 24, introduction, paragraph 1, sentence 3"],["All beliefs that lead to progress should be honoured.","Manual for Teachers, question 24, introduction, paragraph 6, sentence 11"],["You can also use the idea for a particular thought that you recognise as harmful.","Lesson 4, paragraph 5, sentence 1"],["The mind’s preoccupation with the past is the cause of the misconception about time from which your seeing suffers.","Lesson 8, paragraph 1, sentence 4"],["Your mind cannot grasp the present, which is the only time there is.","Lesson 8, paragraph 1, sentence 5"],["My thoughts do not mean anything.","Lesson 10, idea of the day"],["The exercises consist, as before, in searching your mind for all the thoughts that are available to you, without selection or judgement.","Lesson 10, paragraph 5, sentence 1"],["The truth upsets you now, but when your words have been erased, you will see His.","Lesson 12, paragraph 5, sentence 8"],["A meaningless world engenders fear.","Lesson 13, idea of the day"],["Actually, a meaningless world is impossible.","Lesson 13, paragraph 1, sentence 2"],["The world you see has nothing to do with reality.","Lesson 14, paragraph 1, sentence 4"],["Our direction is toward perfect safety and perfect peace.","Lesson 14, paragraph 3, sentence 6"],["With eyes closed, think of all the horrors in the world that cross your mind.","Lesson 14, paragraph 4, sentence 1"],["I have no neutral thoughts.","Lesson 16, idea of the day"],["Everything you see is the result of your thoughts.","Lesson 16, paragraph 1, sentence 2"],["Thoughts are not big or little; powerful or weak.","Lesson 16, paragraph 1, sentence 4"],["A neutral result is impossible because a neutral thought is impossible.","Lesson 16, paragraph 3, sentence 2"],["You see no neutral things because you have no neutral thoughts.","Lesson 17, paragraph 1, sentence 2"],["However, if you do, the length of the practise period may be reduced to less than the minute or so that is otherwise recommended.","Lesson 17, paragraph 2, sentence 2"],["We have not lost sight of the crucial importance of the reversal of your thinking.","Lesson 20, paragraph 1, sentence 4"],["We have not lost sight of the crucial importance of the reversal of your thinking. The salvation of the world depends on it.","Lesson 20, paragraph 1, sentences 4-5"],["Your decision to see is all that vision requires.","Lesson 20, paragraph 3, sentence 1"],["In your determination to see is vision given you.","Lesson 20, paragraph 3, sentence 8"],["You made what you would destroy; everything that you hate and would attack and kill.","Lesson 22, paragraph 2, sentence 4"],["I can escape from the world I see by giving up attack thoughts.","Lesson 23, idea of the day"],["Every thought you have makes up some segment of the world you see.","Lesson 23, paragraph 1, sentence 4"],["There is no point in lamenting the
